type: "class"
desc: "`AccessTokenCache` is a thread-safe token cache that wraps a <xref uid=\"com.azure.core.credential.TokenCredential\" data-throw-if-not-resolved=\"false\" data-raw-source=\"TokenCredential\"></xref> and manages proactive token refresh. It supports both asynchronous and synchronous token retrieval via <xref uid=\"com.azure.core.credential.AccessTokenCache.getToken(com.azure.core.credential.TokenRequestContext,boolean)\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#getToken(TokenRequestContext, boolean)\"></xref> and <xref uid=\"com.azure.core.credential.AccessTokenCache.getTokenSync(com.azure.core.credential.TokenRequestContext,boolean)\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#getTokenSync(TokenRequestContext, boolean)\"></xref>.\n\nThe cache maintains a single cached <xref uid=\"com.azure.core.credential.AccessToken\" data-throw-if-not-resolved=\"false\" data-raw-source=\"AccessToken\"></xref> per instance and proactively refreshes it before expiry (by default 5 minutes before the expiry time, or at the `refreshAt` time if provided by the credential). If a refresh fails while a non-expired token is still available, the cached token continues to be returned until it expires.\n\nWhen the `refreshOnContextChange` flag is `true`, the cache compares the incoming <xref uid=\"com.azure.core.credential.TokenRequestContext\" data-throw-if-not-resolved=\"false\" data-raw-source=\"TokenRequestContext\"></xref> (scopes, tenant ID, claims) against the context used to acquire the current cached token. A mismatch causes an immediate token refresh regardless of expiry. This is the mechanism used to support Continuous Access Evaluation (CAE) claims challenges.\n\n**Note:** Each instance caches exactly one <xref uid=\"com.azure.core.credential.AccessToken\" data-throw-if-not-resolved=\"false\" data-raw-source=\"AccessToken\"></xref> associated with one <xref uid=\"com.azure.core.credential.TokenRequestContext\" data-throw-if-not-resolved=\"false\" data-raw-source=\"TokenRequestContext\"></xref>. Do not share a single `AccessTokenCache` instance across calls that require different scopes or tenants simultaneously, as each new context will evict the previously cached token.\n\nThis class is thread-safe. Multiple threads may call <xref uid=\"com.azure.core.credential.AccessTokenCache.getToken(com.azure.core.credential.TokenRequestContext,boolean)\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#getToken(TokenRequestContext, boolean)\"></xref> and <xref uid=\"com.azure.core.credential.AccessTokenCache.getTokenSync(com.azure.core.credential.TokenRequestContext,boolean)\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#getTokenSync(TokenRequestContext, boolean)\"></xref> concurrently.\n\n**Sample: Wrapping a TokenCredential with AccessTokenCache**\n\n```java\nTokenCredential credential = new BasicAuthenticationCredential(\"username\", \"password\");\n AccessTokenCache tokenCache = new AccessTokenCache(credential);\n TokenRequestContext requestContext = new TokenRequestContext().addScopes(\"https://management.azure.com/.default\");\n // Async usage\n Mono<AccessToken> tokenMono = tokenCache.getToken(requestContext, false);\n // Sync usage\n AccessToken token = tokenCache.getTokenSync(requestContext, false);\n```"
