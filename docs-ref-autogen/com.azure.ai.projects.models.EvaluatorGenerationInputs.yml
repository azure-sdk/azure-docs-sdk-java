  desc: "Get the evaluatorDescription property: Optional human-friendly description for the resulting evaluator. Surfaced as \\`EvaluatorVersion.description\\` on the persisted evaluator. Typically collected from the UI alongside \\`evaluator\\_display\\_name\\`. The \\`evaluator\\_\\` prefix disambiguates this from any other description fields on related models."
