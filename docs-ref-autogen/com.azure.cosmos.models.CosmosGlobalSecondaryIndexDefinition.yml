type: "class"
desc: "Represents the global secondary index definition for a container in the Azure Cosmos DB service. A global secondary index is derived from a source container and is defined by a SQL-like query. Once created, the source container id and the query definition are immutable for the lifetime of the global secondary index.\n\nExample:\n\n```java\nCosmosGlobalSecondaryIndexDefinition definition =\n     new CosmosGlobalSecondaryIndexDefinition(\"gsi-src\", \"SELECT c.customerId, c.emailAddress FROM c\");\n```"
