type: "class"
desc: "Rubric evaluator definition. Ordinary quality rubrics report one aggregate. Safety rubrics require Boolean scoring and an explicit allowed classification on every dimension, and report disallowed\\_behavior\\_violated and allowed\\_behavior\\_violated as two independent lower-is-better metrics. Safety rubrics have no weights, threshold, or combined safety score."
