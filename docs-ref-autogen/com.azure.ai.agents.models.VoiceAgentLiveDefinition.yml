desc: "The Live voice agent definition. Its configuration (model, instructions, audio, and delegation) drives a managed speech-to-speech experience using a Foundry GPT Live deployment. Establish Live voice sessions through \\`GET /agents/\\{agent\\_name\\}/endpoint/protocols/voice/live/sessions\\`. Every create or update produces a new immutable version."
