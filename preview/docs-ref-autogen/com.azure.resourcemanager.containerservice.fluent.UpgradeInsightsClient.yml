  desc: "Gets a stored upgrade insight for the managed cluster by its server-generated name. This is a read-only operation: it returns the most recently generated readiness evaluation for that scope from the data store, including the detected upgrade-blocking issues and contextual upgrade information. It does not regenerate the evaluation. If no non-expired evaluation exists for the name, it returns 404."
