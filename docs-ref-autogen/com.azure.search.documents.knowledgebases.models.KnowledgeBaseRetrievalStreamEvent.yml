desc: "Base for polymorphic events emitted by a streaming knowledge base retrieval. Known events expose typed payloads through their subtype's `getValue()` method. Unrecognized events expose only their names through <xref uid=\"com.azure.search.documents.knowledgebases.models.KnowledgeBaseRetrievalStreamEvent.getEventName()\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#getEventName()\"></xref>; their payloads are not available and they are not terminal. Stream events are envelopes, not JSON payload models; serialize the typed payload instead."
