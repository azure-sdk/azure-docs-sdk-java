desc: "Warning source attribution for a rubric-generation input-quality warning. Per-source values (\\`prompt\\`, \\`agent\\`, \\`dataset\\`) match the source category visible to the generation runtime. \\`aggregate\\` is a synthetic value used only for warnings computed across successfully resolved sources. \\`traces\\` is not exposed because trace sources resolve into dataset content upstream."
