  fullName: "com.azure.resourcemanager.horizondb.fluent.ClustersClient.beginCreateOrReplace(String resourceGroupName, String clusterName, ClusterInner resource)"
  name: "beginCreateOrReplace(String resourceGroupName, String clusterName, ClusterInner resource)"
  nameWithType: "ClustersClient.beginCreateOrReplace(String resourceGroupName, String clusterName, ClusterInner resource)"
  summary: "Creates a new HorizonDB cluster or replaces an existing cluster."
  modifiers:
  - "abstract"
  parameters:
  - description: "The name of the resource group. The name is case insensitive."
    name: "resourceGroupName"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  - description: "The name of the HorizonDB cluster."
    name: "clusterName"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  - description: "Resource create parameters."
