desc: "A GPU SKU pricing plan returned by the \\`calculateCost\\` action. Describes the cost of running a single model replica on the specified \\`vmSize\\`. To estimate the cost of running multiple replicas, scale \\`totalHourlyPrice\\` by the desired replica count, bounded by \\`maxAvailableReplicas\\`."
