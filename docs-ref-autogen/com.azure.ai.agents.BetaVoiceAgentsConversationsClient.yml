  desc: "Get a voice agent conversation's merged recording metadata Returns metadata for the whole-call merged stereo recording (user audio on the left channel, agent audio on the right). The common metadata (format, sample rate, channels, channel layout, duration) is returned for both Foundry-managed and bring-your-own-storage (BYOS) recordings; for BYOS the response additionally includes \\`blob\\_uri\\`, the URI of the recording in the customer's own storage (no SAS) that the customer downloads with their own credentials. The recording is built once from the per-turn segments after persistence finalization succeeds. While the conversation is \\`in\\_progress\\`, this route returns retriable \\`409 Conflict\\` with \\`error.code = recording\\_not\\_ready\\` and a \\`Retry-After\\` header when retry guidance is available. When the conversation is \\`failed\\`, it returns terminal \\`409 Conflict\\` with \\`error.code = recording\\_unavailable\\`. For a \\`completed\\` conversation, metadata is available subject to the existing BYOS behavior. Requires the conversation to have persisted audio (\\`store = true\\`); otherwise returns \\`404\\`.\n\n**Response Body Schema**\n\n```java\n{\n     conversation_id: String (Required)\n     format: String(wav) (Required)\n     sample_rate: int (Required)\n     channels: int (Required)\n     channel_layout (Required): {\n         left: String (Required)\n         right: String (Required)\n     }\n     duration_ms: long (Required)\n     blob_uri: String (Optional)\n }\n```"
