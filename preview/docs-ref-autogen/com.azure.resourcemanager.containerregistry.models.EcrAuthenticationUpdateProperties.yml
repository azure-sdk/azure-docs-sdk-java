  desc: "Get the accountNumber property: The AWS account that owns the IAM role used for authentication. The IAM role is assumed via AWS Security Token Service (STS) when exchanging a federated Entra access token for an ECR access token. The full IAM role ARN is derived from \\`accountNumber\\`, \\`rolePath\\`, and \\`roleName\\` as \\`arn:aws:iam::\\{accountNumber\\}:role\\{rolePath\\}\\{roleName\\}\\` (the initial path defaults to \\`/\\`)."
