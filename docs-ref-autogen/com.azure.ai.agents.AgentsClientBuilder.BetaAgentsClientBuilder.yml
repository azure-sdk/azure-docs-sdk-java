- uid: "com.azure.ai.agents.AgentsClientBuilder.BetaAgentsClientBuilder.buildBetaVoiceAgentWebSocketAsyncClient()"
  fullName: "com.azure.ai.agents.AgentsClientBuilder.BetaAgentsClientBuilder.buildBetaVoiceAgentWebSocketAsyncClient()"
  name: "buildBetaVoiceAgentWebSocketAsyncClient()"
  nameWithType: "AgentsClientBuilder.BetaAgentsClientBuilder.buildBetaVoiceAgentWebSocketAsyncClient()"
  summary: "Builds an asynchronous client for realtime voice-agent Web<wbr>Socket sessions."
  syntax: "public BetaVoiceAgentWebSocketAsyncClient buildBetaVoiceAgentWebSocketAsyncClient()"
  desc: "Builds an asynchronous client for realtime voice-agent WebSocket sessions.\n\nEndpoint, credential, service version, configuration-based proxy settings, and client options are applied to WebSocket handshakes. Custom HTTP clients, pipelines, policies, and retry configuration are not compatible with the native WebSocket transport and cause this method to fail rather than being silently ignored. HTTP log options contribute to the user agent but do not configure WebSocket frame logging."
  returns:
    description: "an asynchronous voice-agent WebSocket client."
    type: "<xref href=\"com.azure.ai.agents.BetaVoiceAgentWebSocketAsyncClient?alt=com.azure.ai.agents.BetaVoiceAgentWebSocketAsyncClient&text=BetaVoiceAgentWebSocketAsyncClient\" data-throw-if-not-resolved=\"False\" />"
