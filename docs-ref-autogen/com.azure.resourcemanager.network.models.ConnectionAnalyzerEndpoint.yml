type: "class"
desc: "Describes a source or destination endpoint of a connection analyzer. The schema is intentionally permissive (a flat object) because the set of valid fields is determined by \\`type\\` and is enforced server-side by the Network Resource Provider. The required and allowed fields per \\`type\\` are: - \\`VM\\`, \\`VMSS\\`, \\`BastionHost\\`, \\`ApplicationGateway\\`: \\`resourceId\\` is required and must be the ARM resource ID of the corresponding resource (a virtual machine, virtual machine scale set or VMSS instance, Azure Bastion host, or Application Gateway, respectively); \\`address\\` is not used; \\`port\\` is optional. - \\`ExternalAddress\\`: \\`address\\` is required and must be an IP address or FQDN reachable from outside Azure; \\`resourceId\\` is not used; \\`port\\` is optional. Requests that supply fields not allowed for the chosen \\`type\\`, or omit a required field, are rejected by the service with a validation error. This follows the same convention used by \\`ConnectivitySource\\` and \\`ConnectivityDestination\\` on Network Watcher."
