- uid: "com.azure.search.documents.indexes.models.KnowledgeBaseOpenAICompatibleParameters.getModelName()"
  fullName: "com.azure.search.documents.indexes.models.KnowledgeBaseOpenAICompatibleParameters.getModelName()"
  name: "getModelName()"
  nameWithType: "KnowledgeBaseOpenAICompatibleParameters.getModelName()"
  summary: "Get the model<wbr>Name property: A supported chat model name that determines Search's capabilities and limits."
  syntax: "public AzureOpenAIModelName getModelName()"
  desc: "Get the modelName property: A supported chat model name that determines Search's capabilities and limits. For knowledge source image verbalization, this is sent as the model selector in the request body; the URI path selects Chat Completions or Responses independently of this name. For knowledge base retrieval, GPT-6 model profiles use Responses and existing model profiles use Chat Completions; the endpoint must support the selected protocol, including stateless tool continuation for Responses. The retrieval request body omits model; the URI or gateway selects the actual model and supplies any required provider model identifier. Embedding models and arbitrary provider protocols are not supported."
  returns:
    description: "the modelName value."
    type: "<xref href=\"com.azure.search.documents.indexes.models.AzureOpenAIModelName?alt=com.azure.search.documents.indexes.models.AzureOpenAIModelName&text=AzureOpenAIModelName\" data-throw-if-not-resolved=\"False\" />"
- uid: "com.azure.search.documents.indexes.models.KnowledgeBaseOpenAICompatibleParameters.getUri()"
  fullName: "com.azure.search.documents.indexes.models.KnowledgeBaseOpenAICompatibleParameters.getUri()"
  name: "getUri()"
  nameWithType: "KnowledgeBaseOpenAICompatibleParameters.getUri()"
  summary: "Get the uri property: The complete HTTPS POST URL, including path and query parameters."
  syntax: "public String getUri()"
  desc: "Get the uri property: The complete HTTPS POST URL, including path and query parameters. Sent unchanged without appending a path or API version; redirects are not followed. For knowledge base retrieval, the endpoint must accept the model profile's Chat Completions or Responses protocol. For knowledge source image verbalization, the URI path must end in /chat/completions or /responses; query parameters do not select the protocol."
  returns:
    description: "the uri value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
