  nameWithType: "EvaluatorGenerationInputs.getEvaluatorDisplayName()"
  summary: "Get the evaluator<wbr>Display<wbr>Name property: Optional human-friendly display name for the resulting evaluator."
  syntax: "public String getEvaluatorDisplayName()"
  desc: "Get the evaluatorDisplayName property: Optional human-friendly display name for the resulting evaluator. Surfaced as \\`EvaluatorVersion.display\\_name\\` on the persisted evaluator. When omitted, the service uses \\`evaluator\\_name\\` as the display name. The \\`evaluator\\_\\` prefix disambiguates this from the immutable \\`evaluator\\_name\\` identifier."
  returns:
    description: "the evaluatorDisplayName value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
- uid: "com.azure.ai.projects.models.EvaluatorGenerationInputs.getEvaluatorName()"
  fullName: "com.azure.ai.projects.models.EvaluatorGenerationInputs.getEvaluatorName()"
  name: "getEvaluatorName()"
  nameWithType: "EvaluatorGenerationInputs.getEvaluatorName()"
  summary: "Get the evaluator<wbr>Name property: The evaluator name (immutable identifier)."
  syntax: "public String getEvaluatorName()"
  desc: "Get the evaluatorName property: The evaluator name (immutable identifier). 1-256 characters; allowed characters are ASCII letters, digits, underscore (\\`\\_\\`), period (\\`.\\`), tilde (\\`~\\`), and hyphen (\\`-\\`). The prefix \\`builtin.\\` is reserved for system-managed evaluators and is rejected by the service. If an evaluator with this name already exists in the project (and is rubric-subtype), the service creates a new version under the same name and uses the prior version's \\`dimensions\\` as context for incremental improvement (foundation of the post-//build adaptive loop). Old versions remain queryable via \\`get\\_version(name, version)\\`. If the existing evaluator is not a rubric-subtype evaluator (built-in, prompt-based, code-based), the request is rejected with \\`400 Bad Request\\`."
  returns:
    description: "the evaluatorName value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
- uid: "com.azure.ai.projects.models.EvaluatorGenerationInputs.getModel()"
  fullName: "com.azure.ai.projects.models.EvaluatorGenerationInputs.getModel()"
  name: "getModel()"
  nameWithType: "EvaluatorGenerationInputs.getModel()"
  summary: "Get the model property: The caller's model for quality rubric generation (e.<wbr>g., 'gpt-4o')."
  syntax: "public String getModel()"
  desc: "Get the model property: The caller's model for quality rubric generation (e.g., 'gpt-4o'). Required by the service when category is quality or omitted. Safety generation and regeneration use centrally managed red teaming simulation capacity, ignore this field when supplied, and do not fall back to caller capacity. Safety rubric scoring separately uses centrally managed red teaming evaluator capacity."
  returns:
    description: "the model value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
- uid: "com.azure.ai.projects.models.EvaluatorGenerationInputs.getPassThreshold()"
  fullName: "com.azure.ai.projects.models.EvaluatorGenerationInputs.getPassThreshold()"
  name: "getPassThreshold()"
  nameWithType: "EvaluatorGenerationInputs.getPassThreshold()"
  summary: "Get the pass<wbr>Threshold property: Optional normalized Likert threshold: omission uses 0.5 for fresh generation and inherits the saved threshold on regeneration."
  syntax: "public Double getPassThreshold()"
  desc: "Get the passThreshold property: Optional normalized Likert threshold: omission uses 0.5 for fresh generation and inherits the saved threshold on regeneration. For ordinary Boolean generation, omit this field or set it to 1; other values are rejected and its all-pass threshold is fixed at 1. Safety generation omits this field because its two violation metrics have no overall threshold."
  returns:
    description: "the passThreshold value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/Double.html\">Double</a>"
- uid: "com.azure.ai.projects.models.EvaluatorGenerationInputs.getScoring()"
  fullName: "com.azure.ai.projects.models.EvaluatorGenerationInputs.getScoring()"
  name: "getScoring()"
  nameWithType: "EvaluatorGenerationInputs.getScoring()"
  summary: "Get the scoring property: Scoring choices for the generated evaluator."
  syntax: "public RubricScoring getScoring()"
  desc: "Get the scoring property: Scoring choices for the generated evaluator. For quality, supplied scoring defaults to Likert; omitted weights on first creation yield equal contribution, and regeneration preserves saved choices. Omitting scoring preserves existing quality generation behavior. Safety generation resolves omitted scoring to Boolean and rejects a conflicting supplied mode; its dimensions use allowed rather than weights and its two metric results are not combined."
  returns:
    description: "the scoring value."
    type: "<xref href=\"com.azure.ai.projects.models.RubricScoring?alt=com.azure.ai.projects.models.RubricScoring&text=RubricScoring\" data-throw-if-not-resolved=\"False\" />"
- uid: "com.azure.ai.projects.models.EvaluatorGenerationInputs.getSources()"
  fullName: "com.azure.ai.projects.models.EvaluatorGenerationInputs.getSources()"
  name: "getSources()"
  nameWithType: "EvaluatorGenerationInputs.getSources()"
  summary: "Get the sources property: Source materials for generation."
  syntax: "public List<EvaluatorGenerationJobSource> getSources()"
  desc: "Get the sources property: Source materials for generation. Safety generation requires a nonempty prompt source for the objective and at least one agent or trace source for application context. An arbitrary dataset cannot replace safety application context. Ordinary generation keeps its existing supported sources."
  returns:
    description: "the sources value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/util/List.html\">List</a>&lt;<xref href=\"com.azure.ai.projects.models.EvaluatorGenerationJobSource?alt=com.azure.ai.projects.models.EvaluatorGenerationJobSource&text=EvaluatorGenerationJobSource\" data-throw-if-not-resolved=\"False\" />&gt;"
