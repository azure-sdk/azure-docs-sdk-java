  name: "CRC64"
  nameWithType: "ContentValidationAlgorithm.CRC64"
  summary: "Azure Storage custom 64-bit CRC."
  desc: "Azure Storage custom 64-bit CRC. The SDK computes and validates CRC64 checksums for the transfer."
- uid: "com.azure.storage.common.ContentValidationAlgorithm.NONE"
  fullName: "com.azure.storage.common.ContentValidationAlgorithm.NONE"
  name: "NONE"
  nameWithType: "ContentValidationAlgorithm.NONE"
  summary: "No content validation."
  desc: "No content validation. This is the default; no checksum is computed or validated."
