- uid: "com.azure.resourcemanager.horizondb.models.Pool.start()"
  fullName: "com.azure.resourcemanager.horizondb.models.Pool.start()"
  name: "start()"
  nameWithType: "Pool.start()"
  summary: "Starts a stopped HorizonDB pool."
  modifiers:
  - "abstract"
  syntax: "public abstract Pool start()"
  desc: "Starts a stopped HorizonDB pool. Power operations are supported only at pool scope in this API version; there is no cluster-level start action. Start does not apply pending dynamic or static parameter changes; parameterGroup.syncStatus remains PendingReboot until a customer-initiated Restart. When the pool is already Ready, the operation succeeds as a true idempotent no-op and likewise leaves pending parameter changes pending. The operation is allowed when the pool has no allocated nodes. After the Pool is running, its Pool-scoped ReadOnly Endpoint routes only when at least one allocated node is not currently playing the read-write role. The request fails with 409 Conflict when another operation is in progress or the pool is in any other incompatible state."
  returns:
    description: "represents the HorizonDB pool."
    type: "<xref href=\"com.azure.resourcemanager.horizondb.models.Pool?alt=com.azure.resourcemanager.horizondb.models.Pool&text=Pool\" data-throw-if-not-resolved=\"False\" />"
