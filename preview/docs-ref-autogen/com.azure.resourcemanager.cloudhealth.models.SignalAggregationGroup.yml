  fullName: "com.azure.resourcemanager.cloudhealth.models.SignalAggregationGroup.ignoreUnknown()"
  name: "ignoreUnknown()"
  nameWithType: "SignalAggregationGroup.ignoreUnknown()"
  summary: "Get the ignore<wbr>Unknown property: If true (default), members reporting Unknown are excluded from the aggregation."
  syntax: "public Boolean ignoreUnknown()"
  desc: "Get the ignoreUnknown property: If true (default), members reporting Unknown are excluded from the aggregation. For MinHealthy and MaxNotHealthy this flag affects the denominator/count and is meaningful. For WorstOf and BestOf the flag has no observable effect: under WorstOf, Unknown=0 is the lowest severity and can never beat any non-Unknown member in a Max() so filtering it changes nothing observable; under BestOf, Unknown is unconditionally excluded by the strategy itself irrespective of the flag. The flag is retained on the contract for vocabulary symmetry across all four strategies."
  returns:
    description: "the ignoreUnknown value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/Boolean.html\">Boolean</a>"
