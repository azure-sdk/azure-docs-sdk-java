- uid: "com.azure.identity.WorkloadIdentityCredentialBuilder.enableAzureProxy()"
  fullName: "com.azure.identity.WorkloadIdentityCredentialBuilder.enableAzureProxy()"
  name: "enableAzureProxy()"
  nameWithType: "WorkloadIdentityCredentialBuilder.enableAzureProxy()"
  summary: "Enables Azure Kubernetes Service (AKS) identity bindings."
  syntax: "public WorkloadIdentityCredentialBuilder enableAzureProxy()"
  desc: "Enables Azure Kubernetes Service (AKS) identity bindings. When proxy configuration is present, authentication requests are sent through the AKS token proxy instead of directly to Microsoft Entra ID.\n\nThis feature is disabled by default and requires using <xref uid=\"com.azure.identity.WorkloadIdentityCredential\" data-throw-if-not-resolved=\"false\" data-raw-source=\"WorkloadIdentityCredential\"></xref> directly. It is not supported by <xref uid=\"com.azure.identity.DefaultAzureCredential\" data-throw-if-not-resolved=\"false\" data-raw-source=\"DefaultAzureCredential\"></xref> or <xref uid=\"com.azure.identity.ManagedIdentityCredential\" data-throw-if-not-resolved=\"false\" data-raw-source=\"ManagedIdentityCredential\"></xref>. The AKS identity binding and Kubernetes permissions must be configured separately. See [AKS identity bindings][].\n\nThe AKS webhook supplies `AZURE_KUBERNETES_TOKEN_PROXY`, `AZURE_KUBERNETES_SNI_NAME`, and either `AZURE_KUBERNETES_CA_FILE` or `AZURE_KUBERNETES_CA_DATA`. Inline CA data must be PEM encoded, not Base64 encoded. If neither CA setting is provided, the platform trust store is used. Changes to a CA file are reloaded on subsequent network requests. Missing or empty files during rotation retain the previously loaded CA; invalid nonempty certificate bundles fail authentication.\n\nIf no proxy settings are present, the credential uses direct authentication. Incomplete or invalid proxy configuration fails rather than falling back to direct authentication. When a proxy is configured, its dedicated transport is set on a copy of the credential options, replacing any client set with <xref uid=\"com.azure.identity.WorkloadIdentityCredentialBuilder.httpClient*\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#httpClient(com.azure.core.http.HttpClient)\"></xref>. A custom HTTP pipeline retains its usual precedence over HTTP client settings. Keep the authority host set to the Microsoft Entra authority, not the proxy URL.\n\n**Sample: Enable AKS identity bindings**\n\n```java\nWorkloadIdentityCredential credential = new WorkloadIdentityCredentialBuilder()\n     .enableAzureProxy()\n     .build();\n```\n\n\n[AKS identity bindings]: https://learn.microsoft.com/azure/aks/identity-bindings-concepts"
  returns:
    description: "An updated instance of this builder with Azure proxy enabled."
    type: "<xref href=\"com.azure.identity.WorkloadIdentityCredentialBuilder?alt=com.azure.identity.WorkloadIdentityCredentialBuilder&text=WorkloadIdentityCredentialBuilder\" data-throw-if-not-resolved=\"False\" />"
