  desc: "Retrieves relevant data from backing stores and streams progress and results as server-sent events. Events are polymorphic: see <xref uid=\"com.azure.search.documents.knowledgebases.models.KnowledgeBaseRetrievalStreamEvent\" data-throw-if-not-resolved=\"false\" data-raw-source=\"KnowledgeBaseRetrievalStreamEvent\"></xref> for the known subtypes. Use a known subtype's `getValue()` to access its typed payload, for example <xref uid=\"com.azure.search.documents.knowledgebases.models.KnowledgeBaseAnswerCompletedStreamEvent.getValue()\" data-throw-if-not-resolved=\"false\" data-raw-source=\"com.azure.search.documents.knowledgebases.models.KnowledgeBaseAnswerCompletedStreamEvent#getValue()\"></xref>. Unrecognized events expose only their names through <xref uid=\"com.azure.search.documents.knowledgebases.models.KnowledgeBaseRetrievalStreamEvent.getEventName()\" data-throw-if-not-resolved=\"false\" data-raw-source=\"KnowledgeBaseRetrievalStreamEvent#getEventName()\"></xref>; their payloads are not available. If received, the terminal `error` or `response.completed` event is emitted before the stream completes. End-of-stream without a terminal event completes normally. Transport and decoding failures are propagated through the reactive error path. The client does not reconnect automatically."
