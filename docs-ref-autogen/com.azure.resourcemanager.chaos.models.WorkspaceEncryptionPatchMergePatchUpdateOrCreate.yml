type: "class"
desc: "A partial encryption setting. Omitted fields are unchanged and null deletes a writable field. A remaining customerManagedKeyEncryption object must have a coherent key URL and vault resource ID. Read-only onboarding and status inputs are ignored. The accepted creation choice cannot change. Only a CMK-created Workspace can update the pair. Changing either member requires synchronous caller and vault validation of the merged pair, including any retained member."
