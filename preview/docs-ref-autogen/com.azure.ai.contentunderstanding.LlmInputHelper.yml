  desc: "Convert a Content Understanding analysis result into LLM-friendly text.\n\nProduces a YAML front matter block (delimited by `---`) followed by a markdown body. The front matter includes `mimeType` and may include caller-supplied `customMetadata`, service-extracted `metadata`, `pages`, `timeRange`, `category`, `fields`, and `warnings`.\n\nThe markdown body contains the extracted text with page-break markers (``) inserted at page boundaries so downstream consumers can locate content by page number. `N` is the **original 1-based page number from the source document** (i.e., the page index in the analyzed PDF), not a counter that restarts at 1 for each call. This matters when the analyze request specifies a <xref uid=\"com.azure.ai.contentunderstanding.models.ContentRange\" data-throw-if-not-resolved=\"false\" data-raw-source=\"com.azure.ai.contentunderstanding.models.ContentRange\"></xref> (e.g., `\"2-3,5\"`): the markers in the output will read `InputPageNumber: 2`, `3`, `5` — not `1`, `2`, `3`. Downstream consumers (RAG indexers, page-citation prompts) can rely on the marker value to cite the correct source page even when only a subset of pages was analyzed. If the service markdown already contains ``"
  returns:
    description: "a formatted string with YAML front matter followed by markdown content.\n     Returns an empty string when <code>result.getContents()</code> is empty."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
