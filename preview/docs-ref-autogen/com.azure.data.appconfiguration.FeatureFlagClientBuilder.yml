type: "class"
desc: "Builds clients for the dedicated feature flag resource. These clients do not manage key-value-backed <xref uid=\"com.azure.data.appconfiguration.models.FeatureFlagConfigurationSetting\" data-throw-if-not-resolved=\"false\" data-raw-source=\"feature flag settings\"></xref>.\n\nFor example, authenticate with a connection string:\n\n```java\nFeatureFlagClient client = new FeatureFlagClientBuilder()\n     .connectionString(connectionString)\n     .buildClient();\n```\n\nA custom pipeline takes precedence over HTTP, authentication, logging, retry, and policy settings. The endpoint and service version still apply. Custom pipelines must supply authentication and any desired policies."
