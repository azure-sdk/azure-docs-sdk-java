  desc: "Get the region property: The AWS region of the upstream Elastic Container Registry (e.g. \\`us-west-2\\`). Only commercial AWS regions are supported; the GovCloud (\\`us-gov-\\*\\`), China (\\`cn-\\*\\`), and Secret/Top Secret ISO (\\`us-iso\\*\\`) partitions are rejected. The pattern stays forward-compatible for new commercial regions without requiring a contract change."
