  desc: "KnowledgeBase retrieves relevant data from backing stores.\n\n**Header Parameters**\n\n    | ------------------------------- | ------ | -------- | ----------------------------------------------------------------------------------------------------------------------------------- |\n    | Name                            | Type   | Required | Description                                                                                                                         |\n    | x-ms-query-source-authorization | String | No       | Token identifying the user for which the query is being executed. This token is used to enforce security restrictions on documents. |\n\nYou can add these to a request with <xref uid=\"com.azure.core.http.rest.RequestOptions.addHeader\" data-throw-if-not-resolved=\"false\" data-raw-source=\"RequestOptions#addHeader\"></xref>"
