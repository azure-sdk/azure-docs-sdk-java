- uid: "com.azure.resourcemanager.horizondb.fluent.PoolsClient.update(java.lang.String,java.lang.String,java.lang.String,com.azure.resourcemanager.horizondb.models.PoolForPatchUpdate)"
  fullName: "com.azure.resourcemanager.horizondb.fluent.PoolsClient.update(String resourceGroupName, String clusterName, String poolName, PoolForPatchUpdate properties)"
  name: "update(String resourceGroupName, String clusterName, String poolName, PoolForPatchUpdate properties)"
  nameWithType: "PoolsClient.update(String resourceGroupName, String clusterName, String poolName, PoolForPatchUpdate properties)"
  summary: "Updates an existing HorizonDB pool, including its node allocation, selected compute model properties, compute model type, high-availability configuration, or associated parameter group."
  modifiers:
  - "abstract"
  parameters:
  - description: "The name of the resource group. The name is case insensitive."
    name: "resourceGroupName"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  - description: "The name of the HorizonDB cluster."
    name: "clusterName"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  - description: "The name of the HorizonDB pool."
    name: "poolName"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  - description: "The resource properties to be updated."
    name: "properties"
    type: "<xref href=\"com.azure.resourcemanager.horizondb.models.PoolForPatchUpdate?alt=com.azure.resourcemanager.horizondb.models.PoolForPatchUpdate&text=PoolForPatchUpdate\" data-throw-if-not-resolved=\"False\" />"
  syntax: "public abstract PoolInner update(String resourceGroupName, String clusterName, String poolName, PoolForPatchUpdate properties)"
  desc: "Updates an existing HorizonDB pool, including its node allocation, selected compute model properties, compute model type, high-availability configuration, or associated parameter group. Omitted nodeCount and highAvailability.mode values preserve their existing values; the service recursively merges the PATCH before atomically validating the effective tuple. nodeCount, when supplied, must be 1 through 16. Disabled is valid only when the effective nodeCount is 1. AnyZone and ZoneRedundant are valid only when the effective nodeCount is 2 through 16. Therefore, crossing between those node-count ranges requires nodeCount and highAvailability.mode to be changed together. AnyZone permits same-zone or cross-zone placement. Changing from AnyZone to ZoneRedundant may allocate a replacement node in another availability zone and replace a read-only node, disconnecting connections to the replaced node. If all requested nodes or the required zonal topology cannot be provisioned, the long-running operation fails and the previous resource state is preserved. To deallocate runtime compute without changing the configured nodeCount, use the Pool stop action. When parameterGroup is supplied, both parameterGroupResourceId and applyMethod are required. The pool can switch its association in either direction between the corresponding default parameter group and a customer-created parameter group. applyMethod controls when dynamic parameter changes become effective. Static parameter changes always require a customer-initiated Restart; Stop followed by Start and scheduled maintenance do not apply pending changes. Subtype-specific compute constraints are validated against the recursively merged configuration."
