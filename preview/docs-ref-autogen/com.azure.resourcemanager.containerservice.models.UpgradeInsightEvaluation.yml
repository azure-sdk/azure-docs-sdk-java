desc: "The evaluation payload shared by all upgrade insight results, containing the overall status, evaluation time, and any detected issues. Whenever this object is present the evaluation has run, so \\`status\\` and \\`evaluatedAt\\` are always populated; the \"not yet evaluated\" state is signaled by the absence of this \\`evaluation\\` object (and by \\`provisioningState\\`), never by a present evaluation with an absent status."
