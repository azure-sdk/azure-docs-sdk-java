  desc: "Create an Agent Insights monitor for an agent.\n\n**Request Body Schema**\n\n```java\n{\n     agent_name: String (Required)\n     enabled: Boolean (Optional)\n     run_interval_hours: Double (Optional)\n     model_deployment_name: String (Required)\n     priorities (Optional): {\n         categories (Optional, Required on create): [\n             String (Optional, Required on create)\n         ]\n         instructions: String (Optional)\n     }\n }\n```\n\n**Response Body Schema**\n\n```java\n{\n     id: String (Required)\n     agent_name: String (Required)\n     enabled: boolean (Required)\n     run_interval_hours: double (Required)\n     model_deployment_name: String (Required)\n     next_scheduled_run_at: Long (Optional)\n     estimated_cost (Optional): {\n         amount: double (Required)\n         currency: String (Required)\n     }\n     suspension (Required): {\n         code: String (Required)\n         message: String (Required)\n         occurred_at: long (Required)\n         details (Optional): {\n             String: BinaryData (Required)\n         }\n     }\n     agent_summary (Optional): {\n         markdown: String (Required)\n     }\n     priorities (Optional): {\n         categories (Required): [\n             String (Required)\n         ]\n         instructions: String (Optional)\n     }\n     updated_at: long (Required)\n }\n```\n\n**Response Headers**\n\n    | -------- | ------ | --------------------------- |\n    | Name     | Type   | Description                 |\n    | Location | String | URL of the created monitor. |"
