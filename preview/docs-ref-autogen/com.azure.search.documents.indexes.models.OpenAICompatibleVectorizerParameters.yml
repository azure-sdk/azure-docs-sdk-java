  name: "getHeaders()"
  nameWithType: "OpenAICompatibleVectorizerParameters.getHeaders()"
  summary: "Get the headers property: Nonempty stored HTTP headers for endpoint authentication."
  syntax: "public Map<String,String> getHeaders()"
  desc: "Get the headers property: Nonempty stored HTTP headers for endpoint authentication. Both names and values are secret and are never returned in responses. Empty maps are invalid. Mutually exclusive with managedIdentityAudience and authIdentity. On update, omitted headers are preserved only on the same resource and vectorizer binding when the exact endpoint, embedding profile including configured dimensions, and authentication identity are unchanged; otherwise, supply fresh credentials."
  returns:
    description: "the headers value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/util/Map.html\">Map</a>&lt;<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>,<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>&gt;"
