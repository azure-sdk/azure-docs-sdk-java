type: "class"
desc: "Reference to a Microsoft Foundry project that backs a \\`MicrosoftFoundry\\` ModelSource. Only the project Azure id is required; the Foundry account and its data-plane endpoint (\\`\\*.services.ai.azure.com\\`) are resolved by the platform from the project (the account is the project's parent resource). Authentication uses the user-assigned managed identity referenced in the ModelSource \\`credential.managedIdentity\\`, which the user must grant the \\`Foundry User\\` role (role definition id 53ca6127-db72-4b80-b1b0-d745d6d5456d) on this project. See https://aka.ms/aks/aim-modelsource for more details."
