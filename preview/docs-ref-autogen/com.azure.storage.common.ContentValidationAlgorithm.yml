desc: "Algorithm for content validation on upload and download operations. When enabled, the SDK computes checksums and validates content integrity using the selected algorithm. Content validation is off by default.\n\nSupported in Azure Storage Blob, Data Lake, and File Share packages for methods that use APIs supporting transactional CRC64, or structured message format."
