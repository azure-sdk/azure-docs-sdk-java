  desc: "Fetch features of the feature collection with id \\`collectionId\\`. Every feature in a dataset belongs to a collection. A dataset may consist of multiple feature collections. A feature collection is often a collection of features of a similar type, based on a common schema.\n\n**Query Parameters**\n\n    | -------- | ------------ | -------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n    | Name     | Type         | Required | Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   |\n    | limit    | Integer      | No       | The optional limit parameter recommends the number of items that should be present in the response document. If the limit parameter value is greater than advertised limit maximum, the server must return the maximum possible number of items, rather than responding with an error. Only items are counted that are on the first level of the collection in the response document. Nested objects contained within the explicitly requested items must not be counted. Minimum = 1. Maximum = 10000. Default = 10.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         |\n    | bbox     | List<String> | No       | Only features that have a geometry that intersects the bounding box are selected. The bounding box is provided as four or six numbers, depending on whether the coordinate reference system includes a vertical axis (height or depth): - Lower left corner, coordinate axis 1 - Lower left corner, coordinate axis 2 - Minimum value, coordinate axis 3 (optional) - Upper right corner, coordinate axis 1 - Upper right corner, coordinate axis 2 - Maximum value, coordinate axis 3 (optional) The coordinate reference system of the values is WGS 84 longitude/latitude (http://www.opengis.net/def/crs/OGC/1.3/CRS84). For WGS 84 longitude/latitude the values are in most cases the sequence of minimum longitude, minimum latitude, maximum longitude and maximum latitude. However, in cases where the box spans the antimeridian the first value (west-most box edge) is larger than the third value (east-most box edge). If the vertical axis is included, the third and the sixth number are the bottom and the top of the 3-dimensional bounding box. If a feature has multiple spatial geometry properties, it is the decision of the server whether only a single spatial geometry property is used to determine the extent or all relevant geometries. In the form of \",\" separated string. |\n    | datetime | String       | No       | Either a date-time or an interval, open or closed. Date and time expressions adhere to RFC 3339. Open intervals are expressed using double-dots. Examples: - A date-time: \"2018-02-12T23:20:50Z\" - A closed interval: \"2018-02-12T00:00:00Z/2018-03-18T12:31:12Z\" - Open intervals: \"2018-02-12T00:00:00Z/..\" or \"../2018-03-18T12:31:12Z\" Only features that have a temporal property that intersects the value of \\`datetime\\` are selected. If a feature has multiple temporal properties, it is the decision of the server whether only a single temporal property is used to determine the extent or all relevant temporal properties.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   |\n    | sign     | String       | No       | Whether to sign asset URLs in the response. Allowed values: \"true\", \"false\".                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  |\n    | duration | Integer      | No       | URL signature duration in minutes.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            |\n    | token    | String       | No       | Pagination token for fetching the next set of results.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        |\n\nYou can add these to a request with <xref uid=\"com.azure.core.http.rest.RequestOptions.addQueryParam\" data-throw-if-not-resolved=\"false\" data-raw-source=\"RequestOptions#addQueryParam\"></xref>\n\n**Response Body Schema**\n\n```java\n{\n     type: String(Feature/FeatureCollection) (Required)\n     stac_version: String (Optional)\n     links (Optional): [\n          (Optional){\n             rel: String (Optional)\n             title: String (Optional)\n             type: String(image/tiff; application=geotiff/image/jp2/image/png/image/jpeg/image/jpg/image/webp/application/x-binary/application/xml/application/json/application/geo+json/text/html/text/plain/application/x-protobuf) (Optional)\n             href: String (Optional, Required on create)\n             hreflang: String (Optional)\n             length: Integer (Optional)\n             method: String(GET/POST) (Optional)\n             headers (Optional): {\n                 String: String (Required)\n             }\n             body (Optional): {\n                 String: BinaryData (Required)\n             }\n             merge: Boolean (Optional)\n         }\n     ]\n     msft:_created: OffsetDateTime (Optional)\n     msft:_updated: OffsetDateTime (Optional)\n     msft:short_description: String (Optional)\n     stac_extensions (Optional): [\n         String (Optional)\n     ]\n     features (Optional, Required on create): [\n          (Optional, Required on create){\n             type: String(Feature/FeatureCollection) (Required)\n             stac_version: String (Optional)\n             links (Optional): [\n                 (recursive schema, see above)\n             ]\n             msft:_created: OffsetDateTime (Optional)\n             msft:_updated: OffsetDateTime (Optional)\n             msft:short_description: String (Optional)\n             stac_extensions (Optional): [\n                 String (Optional)\n             ]\n             geometry (Optional, Required on create): {\n                 type: String(Point/LineString/Polygon/MultiPoint/MultiLineString/MultiPolygon) (Required)\n                 bbox (Optional): [\n                     double (Optional)\n                 ]\n             }\n             id: String (Required)\n             collection: String (Optional)\n             bbox (Optional, Required on create): [\n                 double (Optional, Required on create)\n             ]\n             properties (Optional, Required on create): {\n                 platform: String (Optional)\n                 instruments (Optional): [\n                     String (Optional)\n                 ]\n                 constellation: String (Optional)\n                 mission: String (Optional)\n                 providers (Optional): [\n                      (Optional){\n                         name: String (Optional, Required on create)\n                         description: String (Optional)\n                         roles (Optional): [\n                             String (Optional)\n                         ]\n                         url: String (Optional)\n                     }\n                 ]\n                 gsd: Double (Optional)\n                 created: OffsetDateTime (Optional)\n                 updated: OffsetDateTime (Optional)\n                 title: String (Optional)\n                 description: String (Optional)\n                 datetime: String (Optional, Required on create)\n                 start_datetime: OffsetDateTime (Optional)\n                 end_datetime: OffsetDateTime (Optional)\n                  (Optional): {\n                     String: BinaryData (Required)\n                 }\n             }\n             assets (Optional, Required on create): {\n                 String (Required): {\n                     platform: String (Optional)\n                     instruments (Optional): [\n                         String (Optional)\n                     ]\n                     constellation: String (Optional)\n                     mission: String (Optional)\n                     providers (Optional): [\n                         (recursive schema, see above)\n                     ]\n                     gsd: Double (Optional)\n                     created: OffsetDateTime (Optional)\n                     updated: OffsetDateTime (Optional)\n                     title: String (Optional)\n                     description: String (Optional)\n                     href: String (Optional, Required on create)\n                     type: String (Optional)\n                     roles (Optional): [\n                         String (Optional)\n                     ]\n                      (Optional): {\n                         String: BinaryData (Required)\n                     }\n                 }\n             }\n             _msft:ts: OffsetDateTime (Optional)\n             _msft:etag: String (Optional)\n         }\n     ]\n     bbox (Optional): [\n         double (Optional)\n     ]\n     context (Optional): {\n         returned: int (Optional, Required on create)\n         limit: Integer (Optional)\n         matched: Integer (Optional)\n     }\n }\n```"
