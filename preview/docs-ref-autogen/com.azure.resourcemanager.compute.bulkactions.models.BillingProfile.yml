  name: "maxPrice()"
  nameWithType: "BillingProfile.maxPrice()"
  summary: "Get the max<wbr>Price property: Specifies the maximum price, in US Dollars, you are willing to pay per hour for each Azure Spot virtual machine."
  syntax: "public Double maxPrice()"
  desc: "Get the maxPrice property: Specifies the maximum price, in US Dollars, you are willing to pay per hour for each Azure Spot virtual machine. This price is compared with the current Azure Spot price for the virtual machine size at create time, and the operation only succeeds if maxPrice is greater than the current Azure Spot price. It is also used to evict a virtual machine if the current Azure Spot price rises above it after creation. Possible values are any decimal value greater than zero, or -1 to indicate the default price is up-to on-demand and the virtual machine should not be evicted for price reasons. The default is -1 when not provided."
  returns:
    description: "the maxPrice value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/Double.html\">Double</a>"
