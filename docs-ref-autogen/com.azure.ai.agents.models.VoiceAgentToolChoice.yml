desc: "Tool-selection behavior for a voice agent: a mode, a specific function, or a specific MCP tool.\n\nCreate a choice using <xref uid=\"com.azure.ai.agents.models.VoiceAgentToolChoice.ofMode(com.openai.models.responses.ToolChoiceOptions)\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#ofMode(ToolChoiceOptions)\"></xref>, <xref uid=\"com.azure.ai.agents.models.VoiceAgentToolChoice.ofFunction(com.openai.models.responses.ToolChoiceFunction)\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#ofFunction(ToolChoiceFunction)\"></xref>, or <xref uid=\"com.azure.ai.agents.models.VoiceAgentToolChoice.ofMcp(com.openai.models.responses.ToolChoiceMcp)\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#ofMcp(ToolChoiceMcp)\"></xref>. Pass `null` to a model's `setToolChoice` method to clear the property; the factories do not accept `null`.\n\nUse <xref uid=\"com.azure.ai.agents.models.VoiceAgentToolChoice.getMode()\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#getMode()\"></xref>, <xref uid=\"com.azure.ai.agents.models.VoiceAgentToolChoice.getFunction()\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#getFunction()\"></xref>, or <xref uid=\"com.azure.ai.agents.models.VoiceAgentToolChoice.getMcp()\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#getMcp()\"></xref> to read the selected variant. Getters for other variants return `null`. Unrecognized choices read from JSON are preserved when serialized again; all three getters return `null` for an unrecognized choice."
