type: "class"
desc: "A subject authorized to use the identity binding for token exchange. The namespace selector is required and must be non-empty. The service account selector is optional; when omitted, all service accounts in matching namespaces are authorized. Selectors within a single AllowedSubject are AND'd; multiple AllowedSubjects on an IdentityBinding are OR'd."
