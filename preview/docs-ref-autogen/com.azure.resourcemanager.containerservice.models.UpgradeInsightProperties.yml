  desc: "Get the lastEvaluatedAt property: The UTC time at which this upgrade insight was last computed (the last time the compute operation ran for this resource). This is the resource-level \"last run\" marker and, for a cached record, indicates how stale the stored evaluation is. For a combined evaluation it is the umbrella run time across all scopes, whereas each scope's \\`evaluation.evaluatedAt\\` records when that specific snapshot was produced."
