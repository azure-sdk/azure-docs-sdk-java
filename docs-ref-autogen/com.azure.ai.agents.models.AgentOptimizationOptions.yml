  name: "getMaxStalls()"
  nameWithType: "AgentOptimizationOptions.getMaxStalls()"
  summary: "Get the max<wbr>Stalls property: Maximum number of consecutive reflective minibatch rejections before stopping early."
  syntax: "public Integer getMaxStalls()"
  desc: "Get the maxStalls property: Maximum number of consecutive reflective minibatch rejections before stopping early. A 'stall' occurs when the optimizer proposes a prompt change, evaluates it on a small subset, and the score does not improve — so no full validation-set evaluation is triggered. The counter resets whenever a minibatch passes and its full-validation score beats the current best. Only a sustained plateau of \\`max\\_stalls\\` consecutive minibatch failures triggers the stop. The service defaults to 5 if a value is not specified by the caller. Must be >= 1 when set."
  returns:
    description: "the maxStalls value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/Integer.html\">Integer</a>"
