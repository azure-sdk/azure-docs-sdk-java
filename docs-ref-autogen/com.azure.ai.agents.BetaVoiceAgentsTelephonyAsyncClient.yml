  syntax: "public PollerFlux<BinaryData,BinaryData> beginCreateCampaign(String agentName, String campaignName, BinaryData campaign, RequestOptions requestOptions)"
  desc: "Create or replace a failed telephony campaign Creates a Campaign or fully replaces failed preparation; no PATCH. All recipients must validate and have CallJobs before dialing. Immediate calls may begin before the preparation poller returns.\n\n**Header Parameters**\n\n    | ------------ | ------ | -------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n    | Name         | Type   | Required | Description                                                                                                                                                                                                                                 |\n    | Operation-Id | String | No       | Retry key: matching submitted inputs and original If-Match replay the saved monitor before current-state checks. Conflicting reuse returns 409 operation\\_id\\_conflict; retained creation keys after deletion return 409 campaign\\_deleted. |\n    | If-Match     | String | No       | Required with a fresh Operation-Id for failed-state replacement; no wildcards. Changed input without it returns 409. Missing replacement ID: 400; stale token/absent resource: 412; other states: 409.                                      |\n\nYou can add these to a request with <xref uid=\"com.azure.core.http.rest.RequestOptions.addHeader\" data-throw-if-not-resolved=\"false\" data-raw-source=\"RequestOptions#addHeader\"></xref>\n\n**Request Body Schema**\n\n```java\n{\n     connection_name: String (Required)\n     source (Required): {\n         type: String(phone_number/teams/sip) (Required)\n         value: String (Required)\n     }\n     recipients (Optional): [\n          (Optional){\n             destination (Required): (recursive schema, see destination above)\n             structured_inputs (Optional): {\n                 String: BinaryData (Required)\n             }\n             scheduled_at: Long (Optional)\n         }\n     ]\n     recipient_dataset (Optional): {\n         name: String (Required)\n         version: String (Optional)\n     }\n     schedule (Optional): {\n         type: String(immediate/scheduled/recipient) (Required)\n         expires_at: Long (Optional)\n     }\n     retry_policy (Optional): {\n         type: String(fixed_interval) (Required)\n         max_attempts: Integer (Optional)\n     }\n     status: String(validating/running/cancelling/completed/failed/cancelled/deleting) (Required)\n     error (Optional): {\n         code: String (Required)\n         message: String (Required)\n         param: String (Optional)\n         type: String (Optional)\n         misalignment (Optional): {\n             review_target: String (Optional)\n             error_type: String(potentially_unintended_data_transfer/potentially_unintended_data_access/potentially_unintended_destructive_activity/other) (Optional)\n             detailed_explanation: String (Optional)\n             steer (Optional): {\n                 message: String (Required)\n             }\n         }\n         details (Optional): [\n             (recursive schema, see above)\n         ]\n         additionalInfo (Optional): {\n             String: BinaryData (Required)\n         }\n         debugInfo (Optional): {\n             String: BinaryData (Required)\n         }\n     }\n     name: String (Required)\n     created_at: long (Required)\n     updated_at: long (Required)\n     etag: String (Required)\n     operation_id: String (Required)\n     finished_at: Long (Optional)\n     locked_agent_version: String (Optional)\n     progress (Required): {\n         total_recipients: Long (Optional)\n         pending: long (Required)\n         active: long (Required)\n         completed: long (Required)\n         failed: long (Required)\n         cancelled: long (Required)\n         expired: long (Required)\n     }\n }\n```\n\n**Response Body Schema**\n\n```java\n{\n     connection_name: String (Required)\n     source (Required): {\n         type: String(phone_number/teams/sip) (Required)\n         value: String (Required)\n     }\n     recipients (Optional): [\n          (Optional){\n             destination (Required): (recursive schema, see destination above)\n             structured_inputs (Optional): {\n                 String: BinaryData (Required)\n             }\n             scheduled_at: Long (Optional)\n         }\n     ]\n     recipient_dataset (Optional): {\n         name: String (Required)\n         version: String (Optional)\n     }\n     schedule (Optional): {\n         type: String(immediate/scheduled/recipient) (Required)\n         expires_at: Long (Optional)\n     }\n     retry_policy (Optional): {\n         type: String(fixed_interval) (Required)\n         max_attempts: Integer (Optional)\n     }\n     status: String(validating/running/cancelling/completed/failed/cancelled/deleting) (Required)\n     error (Optional): {\n         code: String (Required)\n         message: String (Required)\n         param: String (Optional)\n         type: String (Optional)\n         misalignment (Optional): {\n             review_target: String (Optional)\n             error_type: String(potentially_unintended_data_transfer/potentially_unintended_data_access/potentially_unintended_destructive_activity/other) (Optional)\n             detailed_explanation: String (Optional)\n             steer (Optional): {\n                 message: String (Required)\n             }\n         }\n         details (Optional): [\n             (recursive schema, see above)\n         ]\n         additionalInfo (Optional): {\n             String: BinaryData (Required)\n         }\n         debugInfo (Optional): {\n             String: BinaryData (Required)\n         }\n     }\n     name: String (Required)\n     created_at: long (Required)\n     updated_at: long (Required)\n     etag: String (Required)\n     operation_id: String (Required)\n     finished_at: Long (Optional)\n     locked_agent_version: String (Optional)\n     progress (Required): {\n         total_recipients: Long (Optional)\n         pending: long (Required)\n         active: long (Required)\n         completed: long (Required)\n         failed: long (Required)\n         cancelled: long (Required)\n         expired: long (Required)\n     }\n }\n```"
  returns:
    description: "the <xref uid=\"com.azure.core.util.polling.PollerFlux\" data-throw-if-not-resolved=\"false\" data-raw-source=\"PollerFlux\"></xref> for polling of agent-owned outbound call Campaign."
