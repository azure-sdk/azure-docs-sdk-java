  name: "minCapacity()"
  nameWithType: "BulkCreateCustomProperties.minCapacity()"
  summary: "Get the min<wbr>Capacity property: The minimum capacity, expressed in units specified by capacity<wbr>Type, that Azure must be able to allocate for the request to proceed."
  syntax: "public Integer minCapacity()"
  desc: "Get the minCapacity property: The minimum capacity, expressed in units specified by capacityType, that Azure must be able to allocate for the request to proceed. If Azure cannot allocate at least this capacity with high confidence, the request is rejected with 409 Conflict (InsufficientCapacity) and no VMs are created. Otherwise, Azure allocates as much capacity as possible, up to the requested capacity. Must be greater than 0, less than capacity, and requires partialFulfillmentPolicy.mode to be Enabled."
  returns:
    description: "the minCapacity value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/Integer.html\">Integer</a>"
