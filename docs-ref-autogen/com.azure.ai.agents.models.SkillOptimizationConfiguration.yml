  name: "getEvaluationConfiguration()"
  nameWithType: "SkillOptimizationConfiguration.getEvaluationConfiguration()"
  summary: "Get the evaluation<wbr>Configuration property: Optional historical training-trace grading and before/after comparison for supported registered targets."
  syntax: "public SkillOptimizationEvaluationConfiguration getEvaluationConfiguration()"
  desc: "Get the evaluationConfiguration property: Optional historical training-trace grading and before/after comparison for supported registered targets. Requires target\\_configuration, evaluation\\_model, and one existing evaluator or evaluator\\_generation\\_configuration. Training verdicts can inform learning; separate before/after scores report impact and do not drive candidate search, selection, or publication. Omitted to skip new training grading and comparison."
  returns:
