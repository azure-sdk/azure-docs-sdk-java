type: "class"
desc: "An asynchronous bidirectional native GPT Live session.\n\nLive events can be sent and received using <xref uid=\"com.openai.models.live.ClientEvent\" data-throw-if-not-resolved=\"false\" data-raw-source=\"ClientEvent\"></xref> and <xref uid=\"com.openai.models.live.ServerEvent\" data-throw-if-not-resolved=\"false\" data-raw-source=\"ServerEvent\"></xref>, or as complete JSON objects. Raw JSON preserves unknown fields, nested `response.event` payloads and Foundry `conversation_id` values. Typed and raw receivers share one event subscriber. Close sessions when they are no longer needed."
