  summary: "Set the node<wbr>Drain<wbr>Timeout<wbr>Minutes property: node<wbr>Drain<wbr>Timeout<wbr>Minutes is the grace period for how long Pod Disruption Budget-protected workloads will be respected during any node draining operation."
