  name: "keyVaultResourceId()"
  nameWithType: "WorkspaceCustomerManagedKeyEncryption.keyVaultResourceId()"
  summary: "Get the key<wbr>Vault<wbr>Resource<wbr>Id property: The fully qualified Azure resource ID of the key vault that contains the key."
  syntax: "public String keyVaultResourceId()"
  desc: "Get the keyVaultResourceId property: The fully qualified Azure resource ID of the key vault that contains the key. Use /subscriptions/\\{subscriptionId\\}/resourceGroups/\\{resourceGroupName\\}/providers/Microsoft.KeyVault/vaults/\\{vaultName\\}, not a key child resource, Managed HSM, or URL. Full PUT with CMK and PATCH that changes either CMK member require Microsoft.KeyVault/vaults/read on the effective vault. The service compares its canonical ID, tenant, and vault URI with the requested pair before accepting the operation."
  returns:
    description: "the keyVaultResourceId value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
