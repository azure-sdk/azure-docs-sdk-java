  syntax: "public void sendEvent(ClientEvent event)"
  desc: "Sends a typed native Live command. Foundry supplies `session.start`; clients must not send it. This method enqueues the event; returning does not mean the frame has been written to the network. Later network failures surface through the receive stream and session lifecycle."
type: "class"
desc: "A synchronous bidirectional native GPT Live session.\n\nEvents can be sent and received using <xref uid=\"com.openai.models.live.ClientEvent\" data-throw-if-not-resolved=\"false\" data-raw-source=\"ClientEvent\"></xref> and <xref uid=\"com.openai.models.live.ServerEvent\" data-throw-if-not-resolved=\"false\" data-raw-source=\"ServerEvent\"></xref>, or as complete JSON objects. Raw JSON preserves unknown fields, nested `response.event` payloads and Foundry `conversation_id` values. Typed and raw receivers share one event iterator. Close sessions when they are no longer needed."
