desc: "Asynchronous client for dedicated feature flag resources, available with API version `2026-05-01-preview`.\n\nThese resources are separate from the key-value-backed <xref uid=\"com.azure.data.appconfiguration.models.FeatureFlagConfigurationSetting\" data-throw-if-not-resolved=\"false\" data-raw-source=\"feature flag settings\"></xref> managed by <xref uid=\"com.azure.data.appconfiguration.ConfigurationAsyncClient\" data-throw-if-not-resolved=\"false\" data-raw-source=\"ConfigurationAsyncClient\"></xref>. Names are used directly, without a key prefix.\n\n```java\nFeatureFlagAsyncClient client = new FeatureFlagClientBuilder().connectionString(connectionString).buildAsyncClient();\n client.addFeatureFlag(new FeatureFlag(\"MyFeature\", true)).subscribe(flag -> System.out.println(flag.getName()));\n```"
metadata: {}
