nal)\n             created: OffsetDateTime (Optional)\n             updated: OffsetDateTime (Optional)\n             title: String (Optional)\n             description: String (Optional)\n             href: String (Optional, Required on create)\n             type: String (Optional)\n             roles (Optional): [\n                 String (Optional)\n             ]\n              (Optional): {\n                 String: BinaryData (Required)\n             }\n         }\n     }\n     item_assets (Optional): {\n         String (Required): {\n             platform: String (Optional)\n             instruments (Optional): [\n                 String (Optional)\n             ]\n             constellation: String (Optional)\n             mission: String (Optional)\n             providers (Optional): [\n                 (recursive schema, see above)\n             ]\n             gsd: Double (Optional)\n             created: OffsetDateTime (Optional)\n             updated: OffsetDateTime (Optional)\n             title: String (Required)\n             description: String (Optional)\n             href: String (Optional)\n             type: String (Required)\n             roles (Optional): [\n                 String (Optional)\n             ]\n              (Optional): {\n                 String: BinaryData (Required)\n             }\n         }\n     }\n     license: String (Required)\n     extent (Required): {\n         spatial (Required): {\n             bbox (Optional): [\n                  (Optional)[\n                     double (Optional)\n                 ]\n             ]\n         }\n         temporal (Required): {\n             interval (Required): [\n                  (Required)[\n                     OffsetDateTime (Required)\n                 ]\n             ]\n         }\n     }\n     keywords (Optional): [\n         String (Optional)\n     ]\n     providers (Optional): [\n         (recursive schema, see above)\n     ]\n     summaries (Optional): {\n         String: BinaryData (Required)\n     }\n      (Optional): {\n         String: BinaryData (Required)\n     }\n }\n```\n\n**Response Body Schema**\n\n```java\n{\n     id: String (Required)\n     status: String(Pending/Running/Succeeded/Canceled/Canceling/Failed) (Required)\n     type: String (Required)\n     creationTime: OffsetDateTime (Required)\n     collectionId: String (Optional)\n     statusHistory (Required): [\n          (Required){\n             timestamp: OffsetDateTime (Required)\n             status: String(Pending/Running/Succeeded/Canceled/Canceling/Failed) (Required)\n             errorCode: String (Optional)\n             errorMessage: String (Optional)\n         }\n     ]\n     startTime: OffsetDateTime (Optional)\n     finishTime: OffsetDateTime (Optional)\n     additionalInformation (Optional): {\n         String: String (Required)\n     }\n     error (Optional): {\n         error (Required): {\n             error (Required): (recursive schema, see error above)\n         }\n     }\n }\n```"
