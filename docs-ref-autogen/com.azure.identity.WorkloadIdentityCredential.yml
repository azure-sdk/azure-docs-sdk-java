desc: "Authenticates workloads on Kubernetes by exchanging a projected service account token for a Microsoft Entra access token. The identity's federated identity credential defines which service account tokens are trusted, without requiring the application to manage a secret or certificate. Refer to [Microsoft Entra Workload ID][] for more information.\n\nAzure Kubernetes Service (AKS) identity bindings allow multiple clusters to share a user-assigned managed identity through a single AKS-managed federated identity credential. To route token exchanges through the AKS token proxy, call <xref uid=\"com.azure.identity.WorkloadIdentityCredentialBuilder.enableAzureProxy()\" data-throw-if-not-resolved=\"false\" data-raw-source=\"WorkloadIdentityCredentialBuilder#enableAzureProxy()\"></xref> when constructing this credential. Identity binding mode is disabled by default and is not supported by <xref uid=\"com.azure.identity.DefaultAzureCredential\" data-throw-if-not-resolved=\"false\" data-raw-source=\"DefaultAzureCredential\"></xref> or <xref uid=\"com.azure.identity.ManagedIdentityCredential\" data-throw-if-not-resolved=\"false\" data-raw-source=\"ManagedIdentityCredential\"></xref>. The binding and Kubernetes permissions must be configured separately.\n\n**Sample: Construct WorkloadIdentityCredential**\n\nThe following code sample demonstrates the creation of a <xref uid=\"com.azure.identity.WorkloadIdentityCredential\" data-throw-if-not-resolved=\"false\" data-raw-source=\"WorkloadIdentityCredential\"></xref>, using the <xref uid=\"com.azure.identity.WorkloadIdentityCredentialBuilder\" data-throw-if-not-resolved=\"false\" data-raw-source=\"WorkloadIdentityCredentialBuilder\"></xref> to configure it. The `clientId`, is required to create <xref uid=\"com.azure.identity.WorkloadIdentityCredential\" data-throw-if-not-resolved=\"false\" data-raw-source=\"WorkloadIdentityCredential\"></xref>. Once this credential is created, it may be passed into the builder of many of the Azure SDK for Java client builders as the 'credential' parameter.\n\n```java\nTokenCredential workloadIdentityCredential = new WorkloadIdentityCredentialBuilder().clientId(\"<clientID>\")\n     .tenantId(\"<tenantID>\")\n     .tokenFilePath(\"<token-file-path>\")\n     .build();\n```\n\n\n[Microsoft Entra Workload ID]: https://learn.microsoft.com/azure/aks/workload-identity-overview"
