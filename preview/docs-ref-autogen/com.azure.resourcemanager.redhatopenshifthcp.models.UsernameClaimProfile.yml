  summary: "Get the prefix<wbr>Policy property: Prefix policy is an optional field that configures how a prefix should be applied to the value of the JWT claim specified in the 'claim' field."
  syntax: "public UsernameClaimPrefixPolicy prefixPolicy()"
  desc: "Get the prefixPolicy property: Prefix policy is an optional field that configures how a prefix should be applied to the value of the JWT claim specified in the 'claim' field. Allowed values are 'Prefix', 'NoPrefix', and 'None'. If not specified, the default policy is 'None'. When set to 'Prefix', the value specified in the prefix field will be prepended to the value of the JWT claim. The prefix field must be set when prefixPolicy is 'Prefix'. When set to 'NoPrefix', no prefix will be prepended to the value of the JWT claim. When set to 'None', this means no opinion and the platform is left to choose any prefixes that are applied which is subject to change over time. Currently, the platform prepends \\`\\{issuerURL\\}\\#\\` to the value of the JWT claim when the claim is not 'email'. As an example, consider the following scenario: \\`prefix\\` is unset, \\`issuerURL\\` is set to \\`https://myoidc.tld\\`, the JWT claims include \"username\":\"userA\" and \"email\":\"userA."
  returns:
    description: "the prefixPolicy value."
    type: "<xref href=\"com.azure.resourcemanager.redhatopenshifthcp.models.UsernameClaimPrefixPolicy?alt=com.azure.resourcemanager.redhatopenshifthcp.models.UsernameClaimPrefixPolicy&text=UsernameClaimPrefixPolicy\" data-throw-if-not-resolved=\"False\" />"
