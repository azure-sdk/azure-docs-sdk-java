  desc: "Builds a synchronous client for realtime voice-agent WebSocket sessions.\n\nEndpoint, credential, service version, configuration-based proxy settings, and client options are applied to WebSocket handshakes. Custom HTTP clients, pipelines, policies, and retry configuration are not compatible with the native WebSocket transport and cause this method to fail rather than being silently ignored. HTTP log options contribute to the user agent but do not configure WebSocket frame logging."
  returns:
