  nameWithType: "PoolsClient.beginUpdate(String resourceGroupName, String clusterName, String poolName, PoolForPatchUpdate properties)"
  summary: "Updates an existing HorizonDB pool, including its node allocation, selected compute model properties, compute model type, high-availability configuration, or associated parameter group."
  modifiers:
  - "abstract"
  parameters:
  - description: "The name of the resource group. The name is case insensitive."
    name: "resourceGroupName"
