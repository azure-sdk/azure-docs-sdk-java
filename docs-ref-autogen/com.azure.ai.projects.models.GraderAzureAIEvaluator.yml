  syntax: "public Map<String,String> getDataMapping()"
  desc: "Get the dataMapping property: Maps the evaluator's input names to fields in the evaluation data. Use \\`\\{\\{item.<field>\\}\\}\\` to reference a field from a dataset item and \\`\\{\\{sample.<field>\\}\\}\\` to reference output generated by a model or agent target. Field names are case-sensitive. This property can be omitted when the evaluator uses standard dataset columns with matching names. Provide a mapping when dataset columns use different names, when a target generates the response at run time, or when the evaluator consumes structured target output."
