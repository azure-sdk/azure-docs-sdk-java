  modifiers:
  - "static"
  - "final"
  field:
    type: "<xref href=\"com.azure.resourcemanager.machinelearning.models.ClassificationModels?alt=com.azure.resourcemanager.machinelearning.models.ClassificationModels&text=ClassificationModels\" data-throw-if-not-resolved=\"False\" />"
  syntax: "public static final ClassificationModels LOGISTIC_REGRESSION"
  desc: "Logistic regression is a fundamental classification technique. It belongs to the group of linear classifiers and is somewhat similar to polynomial and linear regression. Logistic regression is fast and relatively uncomplicated, and it's convenient for you to interpret the results. Although it's essentially a method for binary classification, it can also be applied to multiclass problems."
- uid: "com.azure.resourcemanager.machinelearning.models.ClassificationModels.MULTINOMIAL_NAIVE_BAYES"
