  syntax: "public void sendEvent(BinaryData event)"
  desc: "Sends a native Live JSON event. Foundry supplies `session.start`; clients must not send it. The service validates native command semantics, including delegation restrictions. This method enqueues the event; returning does not mean the frame has been written to the network. Later network failures surface through the receive stream and session lifecycle."
