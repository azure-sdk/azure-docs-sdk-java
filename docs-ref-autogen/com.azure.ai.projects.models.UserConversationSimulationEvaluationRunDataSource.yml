type: "class"
desc: "Evaluates a model or agent by simulating user conversations against it. Each source item defines a test scenario. Use a JSONL source or an \\`inline\\_user\\_conversation\\_simulation\\` source with strongly typed test cases. JSONL attributes use the inline test-case property names by default; specify \\`data\\_mapping\\` only when the dataset uses different names. The model specified by \\`model\\_configuration\\` generates the simulated user's turns and drives the conversation with \\`target\\` until it reaches the desired length or maximum turn limit. The evaluation's testing criteria are then applied to the conversation."
