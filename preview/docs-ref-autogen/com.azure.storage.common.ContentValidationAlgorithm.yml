fields:
- uid: "com.azure.storage.common.ContentValidationAlgorithm.AUTO"
  fullName: "com.azure.storage.common.ContentValidationAlgorithm.AUTO"
  name: "AUTO"
  nameWithType: "ContentValidationAlgorithm.AUTO"
  summary: "Allow the SDK to choose the validation algorithm."
  desc: "Allow the SDK to choose the validation algorithm. Currently resolves to CRC64 where supported. Different library versions may make different choices. The resolution may change in the future. Please set an explicit algorithm if you need a specific behavior."
