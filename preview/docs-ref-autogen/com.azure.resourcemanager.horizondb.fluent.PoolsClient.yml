- uid: "com.azure.resourcemanager.horizondb.fluent.PoolsClient.beginRestart(java.lang.String,java.lang.String,java.lang.String)"
  fullName: "com.azure.resourcemanager.horizondb.fluent.PoolsClient.beginRestart(String resourceGroupName, String clusterName, String poolName)"
  name: "beginRestart(String resourceGroupName, String clusterName, String poolName)"
  nameWithType: "PoolsClient.beginRestart(String resourceGroupName, String clusterName, String poolName)"
  summary: "Restarts the PostgreSQL container on all allocated nodes in a ready HorizonDB pool and applies pending dynamic and static parameter changes."
  modifiers:
  - "abstract"
  parameters:
  - description: "The name of the resource group. The name is case insensitive."
    name: "resourceGroupName"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  - description: "The name of the HorizonDB cluster."
    name: "clusterName"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  - description: "The name of the HorizonDB pool."
    name: "poolName"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  syntax: "public abstract SyncPoller<PollResult<PoolInner>,PoolInner> beginRestart(String resourceGroupName, String clusterName, String poolName)"
  desc: "Restarts the PostgreSQL container on all allocated nodes in a ready HorizonDB pool and applies pending dynamic and static parameter changes. This customer-initiated Restart is the only operation that applies static parameter changes or dynamic parameter changes requested with PendingReboot; Stop followed by Start and scheduled maintenance do not apply them. Power operations are supported only at pool scope in this API version; there is no cluster-level restart action. When the pool has no allocated nodes, the operation succeeds without restarting any nodes, pending changes are considered applied, parameterGroup.syncStatus becomes InSync, and the resulting configuration applies to nodes allocated later. The request fails with 409 Conflict when another operation is in progress or the pool is in any other incompatible state."
  returns:
    description: "the <xref uid=\"com.azure.core.util.polling.SyncPoller\" data-throw-if-not-resolved=\"false\" data-raw-source=\"SyncPoller\"></xref> for polling of represents the HorizonDB pool."
    type: "<xref href=\"com.azure.core.util.polling.SyncPoller?alt=com.azure.core.util.polling.SyncPoller&text=SyncPoller\" data-throw-if-not-resolved=\"False\" />&lt;<xref href=\"com.azure.core.management.polling.PollResult?alt=com.azure.core.management.polling.PollResult&text=PollResult\" data-throw-if-not-resolved=\"False\" />&lt;<xref href=\"com.azure.resourcemanager.horizondb.fluent.models.PoolInner?alt=com.azure.resourcemanager.horizondb.fluent.models.PoolInner&text=PoolInner\" data-throw-if-not-resolved=\"False\" />&gt;,<xref href=\"com.azure.resourcemanager.horizondb.fluent.models.PoolInner?alt=com.azure.resourcemanager.horizondb.fluent.models.PoolInner&text=PoolInner\" data-throw-if-not-resolved=\"False\" />&gt;"
