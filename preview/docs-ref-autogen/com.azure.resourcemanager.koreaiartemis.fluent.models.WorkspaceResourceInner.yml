type: "class"
desc: "A Workspace resource in the Kore.AgentPlatform provider. Child proxy resource type under an Organization. Workspaces are not tracked (no \\`location\\`/\\`tags\\`). Lifecycle is managed through the standard ARM verbs on the child URL: - PUT .../organizations/\\{org\\}/workspaces/\\{workspaceName\\} (create or update) - DELETE .../organizations/\\{org\\}/workspaces/\\{workspaceName\\} - GET .../organizations/\\{org\\}/workspaces/\\{workspaceName\\} - GET .../organizations/\\{org\\}/workspaces (list by parent) A default Workspace is also provisioned atomically when the parent Organization is created (see \\`OrganizationProperties.defaultWorkspace\\`); additional Workspaces are managed via the operations defined here."
metadata: {}
