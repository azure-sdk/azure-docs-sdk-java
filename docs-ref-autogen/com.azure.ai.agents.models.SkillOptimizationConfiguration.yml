  name: "getTrainingSplitRatio()"
  nameWithType: "SkillOptimizationConfiguration.getTrainingSplitRatio()"
  summary: "Get the training<wbr>Split<wbr>Ratio property: Fraction of generated question groups assigned to learning, strictly greater than 0 and less than 1."
  syntax: "public Double getTrainingSplitRatio()"
  desc: "Get the trainingSplitRatio property: Fraction of generated question groups assigned to learning, strictly greater than 0 and less than 1. Defaults to 0.7 when omitted. Normalized questions and shared source traces stay in the same group, and every generated row belongs to learning or validation. The service rejects splits that leave either side empty. Caller-provided validation data is not split."
  returns:
    description: "the trainingSplitRatio value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/Double.html\">Double</a>"
