- uid: "com.azure.search.documents.indexes.models.OpenAICompatibleVectorizerParameters.getDimensions()"
  fullName: "com.azure.search.documents.indexes.models.OpenAICompatibleVectorizerParameters.getDimensions()"
  name: "getDimensions()"
  nameWithType: "OpenAICompatibleVectorizerParameters.getDimensions()"
  summary: "Get the dimensions property: The output dimensions, which must match the target vector field."
  syntax: "public Integer getDimensions()"
  desc: "Get the dimensions property: The output dimensions, which must match the target vector field. Defaults to 1536 for text-embedding-ada-002 and text-embedding-3-small, or 3072 for text-embedding-3-large. Ada requires 1536; text-embedding-3-small supports 1 through 1536, and text-embedding-3-large supports 1 through 3072. Preserving omitted headers on update requires the configured dimensions to remain unchanged; omitting dimensions is distinct from specifying the default explicitly."
  returns:
    description: "the dimensions value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/Integer.html\">Integer</a>"
- uid: "com.azure.search.documents.indexes.models.OpenAICompatibleVectorizerParameters.getHeaders()"
