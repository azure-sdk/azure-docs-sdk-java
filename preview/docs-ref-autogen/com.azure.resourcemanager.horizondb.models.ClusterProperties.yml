- uid: "com.azure.resourcemanager.horizondb.models.ClusterProperties.creationMode()"
  fullName: "com.azure.resourcemanager.horizondb.models.ClusterProperties.creationMode()"
  name: "creationMode()"
  nameWithType: "ClusterProperties.creationMode()"
  summary: "Get the creation<wbr>Mode property: The mode used to create the cluster."
  syntax: "public ClusterCreateMode creationMode()"
  desc: "Get the creationMode property: The mode used to create the cluster. When this property is omitted while creating a new cluster, the service records Create. PointInTimeRestore creates a new cluster from an available backup; pointInTimeUtc and creationSourceClusterResourceId are then required, postgreSqlVersion must be omitted because it is obtained from the backup metadata, and creationSourceClusterLocation is required when the source and target cluster locations differ. This property is immutable and is returned as creation provenance. On replacement, omission preserves the recorded value, resubmitting the same value is accepted, and changing it is rejected."
  returns:
    description: "the creationMode value."
    type: "<xref href=\"com.azure.resourcemanager.horizondb.models.ClusterCreateMode?alt=com.azure.resourcemanager.horizondb.models.ClusterCreateMode&text=ClusterCreateMode\" data-throw-if-not-resolved=\"False\" />"
- uid: "com.azure.resourcemanager.horizondb.models.ClusterProperties.creationSourceClusterLocation()"
  fullName: "com.azure.resourcemanager.horizondb.models.ClusterProperties.creationSourceClusterLocation()"
  name: "creationSourceClusterLocation()"
  nameWithType: "ClusterProperties.creationSourceClusterLocation()"
  summary: "Get the creation<wbr>Source<wbr>Cluster<wbr>Location property: The Azure location of the source HorizonDB cluster used for point-in-time restore."
  syntax: "public String creationSourceClusterLocation()"
  desc: "Get the creationSourceClusterLocation property: The Azure location of the source HorizonDB cluster used for point-in-time restore. This property is optional when the source and target cluster locations are the same. It is required when the source cluster location differs from the target cluster location and must identify the source cluster's location. This property must be absent for creation modes other than PointInTimeRestore or when creationMode is omitted. This immutable creation-provenance value does not change after creation."
  returns:
    description: "the creationSourceClusterLocation value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
- uid: "com.azure.resourcemanager.horizondb.models.ClusterProperties.creationSourceClusterResourceId()"
  fullName: "com.azure.resourcemanager.horizondb.models.ClusterProperties.creationSourceClusterResourceId()"
  name: "creationSourceClusterResourceId()"
  nameWithType: "ClusterProperties.creationSourceClusterResourceId()"
  summary: "Get the creation<wbr>Source<wbr>Cluster<wbr>Resource<wbr>Id property: The Azure resource ID of the source HorizonDB cluster used by the selected creation mode."
  syntax: "public String creationSourceClusterResourceId()"
  desc: "Get the creationSourceClusterResourceId property: The Azure resource ID of the source HorizonDB cluster used by the selected creation mode. This property is required for PointInTimeRestore and other source-based creation modes, and must be absent when creationMode is Create or omitted. A source cluster does not need to have a pool to be restored, provided an available backup exists. This immutable creation-provenance value does not change after creation."
  returns:
    description: "the creationSourceClusterResourceId value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
- uid: "com.azure.resourcemanager.horizondb.models.ClusterProperties.dataEncryption()"
  fullName: "com.azure.resourcemanager.horizondb.models.ClusterProperties.dataEncryption()"
  name: "dataEncryption()"
  nameWithType: "ClusterProperties.dataEncryption()"
  summary: "Get the data<wbr>Encryption property: The data encryption configuration for the cluster."
  syntax: "public HorizonDbClusterDataEncryption dataEncryption()"
  desc: "Get the dataEncryption property: The data encryption configuration for the cluster. When omitted during initial cluster creation, the service uses SystemManaged encryption. When supplied during initial cluster creation, type is required. For PUT updates of an existing cluster, type may be omitted; if provided, it must match the existing encryption type. The encryption type is selected at cluster creation; switching between SystemManaged and AzureKeyVault after creation is not supported."
  returns:
    description: "the dataEncryption value."
    type: "<xref href=\"com.azure.resourcemanager.horizondb.models.HorizonDbClusterDataEncryption?alt=com.azure.resourcemanager.horizondb.models.HorizonDbClusterDataEncryption&text=HorizonDbClusterDataEncryption\" data-throw-if-not-resolved=\"False\" />"
