fields:
- uid: "com.azure.resourcemanager.chaos.models.FailureBehavior.CONTINUE"
  fullName: "com.azure.resourcemanager.chaos.models.FailureBehavior.CONTINUE"
  name: "CONTINUE"
  nameWithType: "FailureBehavior.CONTINUE"
  summary: "The action failure is suppressed: it does not by itself end the scenario run, and the run continues with its remaining actions."
  modifiers:
  - "static"
  - "final"
  field:
    type: "<xref href=\"com.azure.resourcemanager.chaos.models.FailureBehavior?alt=com.azure.resourcemanager.chaos.models.FailureBehavior&text=FailureBehavior\" data-throw-if-not-resolved=\"False\" />"
  syntax: "public static final FailureBehavior CONTINUE"
  desc: "The action failure is suppressed: it does not by itself end the scenario run, and the run continues with its remaining actions. Suppression affects the run's result only. It does not change dependency scheduling, which stays under the control of each action's \\`runAfter\\` — an action that should still start after a failed dependency says so there. A run that completes normally and whose action failures were all suppressed terminates as \\`PartiallySucceeded\\`. Any failure that is not suppressed still drives the run to \\`Failed\\`, and cancellation keeps its existing result."
- uid: "com.azure.resourcemanager.chaos.models.FailureBehavior.STOP"
  fullName: "com.azure.resourcemanager.chaos.models.FailureBehavior.STOP"
  name: "STOP"
  nameWithType: "FailureBehavior.STOP"
  summary: "The action failure stops the scenario run and drives it to the \\`Failed\\` terminal state."
  modifiers:
  - "static"
  - "final"
  field:
    type: "<xref href=\"com.azure.resourcemanager.chaos.models.FailureBehavior?alt=com.azure.resourcemanager.chaos.models.FailureBehavior&text=FailureBehavior\" data-throw-if-not-resolved=\"False\" />"
  syntax: "public static final FailureBehavior STOP"
  desc: "The action failure stops the scenario run and drives it to the \\`Failed\\` terminal state. This is the effective behavior when no \\`failureBehavior\\` is supplied."
