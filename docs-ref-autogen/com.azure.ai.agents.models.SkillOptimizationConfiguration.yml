- uid: "com.azure.ai.agents.models.SkillOptimizationConfiguration.getContext()"
  fullName: "com.azure.ai.agents.models.SkillOptimizationConfiguration.getContext()"
  name: "getContext()"
  nameWithType: "SkillOptimizationConfiguration.getContext()"
  summary: "Get the context property: At least one context item containing trace evidence, optional steering guidance, and optional exact baseline references."
  syntax: "public List<OptimizationContext> getContext()"
  desc: "Get the context property: At least one context item containing trace evidence, optional steering guidance, and optional exact baseline references. Supply agent\\_traces context; use separate steering\\_prompt and skill\\_references items for guidance and baselines. For skill optimization only, a steering prompt must be non-empty and at most 100 KiB (102,400 UTF-8 bytes), enforced by the service; oversized prompts are rejected rather than truncated."
  returns:
    description: "the context value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/util/List.html\">List</a>&lt;<xref href=\"com.azure.ai.agents.models.OptimizationContext?alt=com.azure.ai.agents.models.OptimizationContext&text=OptimizationContext\" data-throw-if-not-resolved=\"False\" />&gt;"
