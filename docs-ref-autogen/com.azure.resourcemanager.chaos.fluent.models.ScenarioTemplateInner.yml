type: "class"
desc: "Model that represents a built-in scenario template. A scenario template is a versioned, read-only blueprint published by Microsoft that can be used to create a scenario. Templates are the same shape as the scenarios they produce, so an action read from a template is valid input to a scenario create. The template is addressed without a version, and always describes its newest published version. Address a specific version through the child versions resource."
