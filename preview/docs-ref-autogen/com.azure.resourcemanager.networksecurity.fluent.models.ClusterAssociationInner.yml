type: "class"
desc: "ClusterAssociation resource. Enrolls an AKS managed cluster, or an ACI SandboxGroup, into this AgentFabric; deleting it removes the enrollment. This is not a Member. Workloads are enrolled separately, and creating an association does not create members."
