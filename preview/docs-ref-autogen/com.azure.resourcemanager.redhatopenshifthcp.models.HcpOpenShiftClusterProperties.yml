- uid: "com.azure.resourcemanager.redhatopenshifthcp.models.HcpOpenShiftClusterProperties.nodeDrainTimeoutMinutes()"
  fullName: "com.azure.resourcemanager.redhatopenshifthcp.models.HcpOpenShiftClusterProperties.nodeDrainTimeoutMinutes()"
  name: "nodeDrainTimeoutMinutes()"
  nameWithType: "HcpOpenShiftClusterProperties.nodeDrainTimeoutMinutes()"
  summary: "Get the node<wbr>Drain<wbr>Timeout<wbr>Minutes property: node<wbr>Drain<wbr>Timeout<wbr>Minutes is the grace period for how long Pod Disruption Budget-protected workloads will be respected during any node draining operation."
  syntax: "public Integer nodeDrainTimeoutMinutes()"
  desc: "Get the nodeDrainTimeoutMinutes property: nodeDrainTimeoutMinutes is the grace period for how long Pod Disruption Budget-protected workloads will be respected during any node draining operation. After this grace period, any workloads protected by Pod Disruption Budgets that have not been successfully drained from a node will be forcibly evicted. This is especially relevant to cluster upgrades. Valid values are in minutes and from 0 to 10080 minutes (1 week). 0 means that the MachinePool can be drained without any time limitation. This is the value is used a default for all NodePools. It can be overridden by specifying nodeDrainTimeoutMinutes for a given NodePool."
  returns:
    description: "the nodeDrainTimeoutMinutes value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/Integer.html\">Integer</a>"
