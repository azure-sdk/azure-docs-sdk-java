type: "class"
desc: "The configuration for reconstructing existing traced conversations for evaluation, not synthetic conversation simulation. This preview requires \\`scenario\\` to be \\`evaluation\\`, sources of type \\`traces\\`, and the \\`Foundry-Features: DataGenerationJobs=V1Preview\\` request header. Conversation-level sampling is implicit; \\`sample\\_level\\` is not supported. Existing trace selection, annotations, and output dataset row schemas are unchanged. Create, get, and list responses preserve \\`type: conversations\\`. The service enforces the scenario, source, and conditional model-options requirements. Conversation-level output rows contain \\`test\\_case\\_id\\`, \\`messages\\`, \\`tool\\_definitions\\`, and \\`metadata\\`. A successful optional description adds \\`test\\_case\\_description\\`. If description generation fails, the row is retained with safe row-level status and error metadata, without raw provider or model error bodies."
metadata: {}
