type: "class"
desc: "Traffic selection using exactly one of \\`additionalInfo\\` or \\`and\\`. Additional-info names must be unique across the complete expression. Filters narrow the owner's scope and cannot extend a project-owned control to another project. Values within one condition are alternatives; conditions are combined with AND. An agent selection requires an explicit project filter selecting exactly one project, including for project-owned controls."
