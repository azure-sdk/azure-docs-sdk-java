- uid: "com.azure.resourcemanager.horizondb.fluent.PoolsClient.delete(java.lang.String,java.lang.String,java.lang.String)"
  fullName: "com.azure.resourcemanager.horizondb.fluent.PoolsClient.delete(String resourceGroupName, String clusterName, String poolName)"
  name: "delete(String resourceGroupName, String clusterName, String poolName)"
  nameWithType: "PoolsClient.delete(String resourceGroupName, String clusterName, String poolName)"
  summary: "Deletes a HorizonDB pool together with the Pool-scoped Endpoint whose associated<wbr>Resource<wbr>Id identifies that Pool and all Firewall<wbr>Rule children of that Endpoint."
  modifiers:
  - "abstract"
  parameters:
  - description: "The name of the resource group. The name is case insensitive."
    name: "resourceGroupName"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
