- uid: "com.azure.resourcemanager.chaos.models.ScenarioTemplateProperties.actions()"
  fullName: "com.azure.resourcemanager.chaos.models.ScenarioTemplateProperties.actions()"
  name: "actions()"
  nameWithType: "ScenarioTemplateProperties.actions()"
  summary: "Get the actions property: The actions that define the template's orchestration."
  syntax: "public List<ScenarioAction> actions()"
  desc: "Get the actions property: The actions that define the template's orchestration. These are the same model a scenario publishes, and carry unresolved \\`%%\\\\\\{...\\\\\\}%%\\` macros; the macros are substituted when the scenario runs, not when it is read or created. Three macro namespaces may appear: - \\`%%\\\\\\{parameters.\\\\<name\\\\>\\\\\\}%%\\` — resolves from the parameter values supplied when the scenario is configured. The accepted names are declared by \\`parameters\\`. - \\`%%\\\\\\{resourceTargeting.include.\\\\<dimension\\\\>\\\\\\}%%\\` — resolves from the resource targeting of the scenario's configuration (for example \\`zones\\`, \\`locations\\`). The template does not declare these; they are dimensions of the configuration supplied at run time. - \\`%%\\\\\\{filters.\\\\<dimension\\\\>\\\\\\}%%\\` — deprecated spelling of \\`resourceTargeting.include.\\`, retained only so that superseded template versions keep resolving. Do not depend on it; the newest version of every template uses \\`resourceTargeting.include.\\`. An action's \\`failureBehavior\\` overrides the template-wide \\`failureBehavior\\` for that action alone; an action that does not carry one inherits the template-wide value."
  returns:
    description: "the actions value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/util/List.html\">List</a>&lt;<xref href=\"com.azure.resourcemanager.chaos.models.ScenarioAction?alt=com.azure.resourcemanager.chaos.models.ScenarioAction&text=ScenarioAction\" data-throw-if-not-resolved=\"False\" />&gt;"
