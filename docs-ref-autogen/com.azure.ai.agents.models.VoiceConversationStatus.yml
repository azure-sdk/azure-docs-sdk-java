type: "class"
desc: "The lifecycle status of a persisted voice conversation: - \\`in\\_progress\\`: the live session is active, or post-session persistence finalization is pending. - \\`completed\\`: finalization succeeded after normal or client close, \\`end\\_conversation\\`, a max-duration \\`1001\\` close, or a client or network disconnect that the service can still finalize. - \\`failed\\`: a terminal service, bridge, storage, or unrecoverable transport failure prevented finalization."
