  syntax: "public String getDatetime()"
  desc: "Get the datetime property: Either a date-time or an interval, open or closed. Date and time expressions adhere to RFC 3339. Open intervals are expressed using double-dots. Examples: - A date-time: \"2018-02-12T23:20:50Z\" - A closed interval: \"2018-02-12T00:00:00Z/2018-03-18T12:31:12Z\" - Open intervals: \"2018-02-12T00:00:00Z/..\" or \"../2018-03-18T12:31:12Z\" Only features that have a temporal property that intersects the value of \\`datetime\\` are selected. If a feature has multiple temporal properties, it is the decision of the server whether only a single temporal property is used to determine the extent or all relevant temporal properties."
  returns:
    description: "the datetime value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
