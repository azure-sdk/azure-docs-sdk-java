- uid: "com.azure.resourcemanager.containerservice.models.SoftEvictionThreshold.memoryAvailable()"
  fullName: "com.azure.resourcemanager.containerservice.models.SoftEvictionThreshold.memoryAvailable()"
  name: "memoryAvailable()"
  nameWithType: "SoftEvictionThreshold.memoryAvailable()"
  summary: "Get the memory<wbr>Available property: The threshold for available memory below which soft pod eviction is triggered."
  syntax: "public String memoryAvailable()"
  desc: "Get the memoryAvailable property: The threshold for available memory below which soft pod eviction is triggered. Accepts absolute values (e.g. '500Mi') or percentage values (e.g. '5%'). Absolute minimum is 100Mi; percentage minimum is 2%. Default uses a capacity-based step ladder: 500Mi for nodes with <=8GiB, 750Mi for 16GiB, and 1024Mi (1Gi) for >=32GiB. Must also be greater than the effective hardEvictionThreshold.memoryAvailable."
  returns:
    description: "the memoryAvailable value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
