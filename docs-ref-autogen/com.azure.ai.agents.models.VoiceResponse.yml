desc: "A persisted voice response representing one model inference turn within a conversation. In list results the \\`output\\` projection may be omitted; retrieve the full response (\\`GET .../responses/\\{response\\_id\\}\\`) or the paged response-items route (\\`GET .../responses/\\{response\\_id\\}/items\\`) for its output items. \\`created\\_at\\`/\\`completed\\_at\\` are Foundry durable ordering extensions."
