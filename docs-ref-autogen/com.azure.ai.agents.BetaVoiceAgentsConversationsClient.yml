- uid: "com.azure.ai.agents.BetaVoiceAgentsConversationsClient.downloadAgentConversationAudio(java.lang.String,java.lang.String)"
  fullName: "com.azure.ai.agents.BetaVoiceAgentsConversationsClient.downloadAgentConversationAudio(String agentName, String conversationId)"
  name: "downloadAgentConversationAudio(String agentName, String conversationId)"
  nameWithType: "BetaVoiceAgentsConversationsClient.downloadAgentConversationAudio(String agentName, String conversationId)"
  summary: "Stream a voice agent conversation's merged recording Streams the whole-call merged stereo recording as a WAV (\\`audio/wav\\`) byte stream through the service (no SAS URL)."
  parameters:
  - description: "The name of the agent."
    name: "agentName"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  - description: "The id of the conversation whose merged recording is streamed."
    name: "conversationId"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  syntax: "public BinaryData downloadAgentConversationAudio(String agentName, String conversationId)"
  desc: "Stream a voice agent conversation's merged recording Streams the whole-call merged stereo recording as a WAV (\\`audio/wav\\`) byte stream through the service (no SAS URL). This route serves Foundry-managed storage only. For bring-your-own-storage (BYOS) recordings the bytes are not proxied — the caller must download directly from customer storage using the \\`blob\\_uri\\` returned by the metadata route — so this route returns \\`409 Conflict\\` for BYOS recordings. While the conversation is \\`in\\_progress\\`, this route returns retriable \\`409 Conflict\\` with \\`error.code = recording\\_not\\_ready\\` and a \\`Retry-After\\` header when retry guidance is available. When the conversation is \\`failed\\`, it returns terminal \\`409 Conflict\\` with \\`error.code = recording\\_unavailable\\`. For a \\`completed\\` conversation, content is available subject to the existing BYOS behavior. A conversation without persisted audio (\\`store = false\\`) returns \\`404\\`."
  returns:
    description: "the response."
    type: "<xref href=\"com.azure.core.util.BinaryData?alt=com.azure.core.util.BinaryData&text=BinaryData\" data-throw-if-not-resolved=\"False\" />"
