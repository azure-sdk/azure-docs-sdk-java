- uid: "com.microsoft.cognitiveservices.speech.audio.PushAudioInputStream.commit()"
  fullName: "com.microsoft.cognitiveservices.speech.audio.PushAudioInputStream.commit()"
  name: "commit()"
  nameWithType: "PushAudioInputStream.commit()"
  summary: "Requests that the audio written so far be committed as a completed segment."
  syntax: "public int commit()"
  desc: "Requests that the audio written so far be committed as a completed segment. Non-blocking; returns immediately with a correlation token. The request is advisory. A token is issued as soon as the request is recorded, but there is no guarantee that it will be acknowledged: the service may not support inline commit, or the session may end first. Applications must tolerate a token that is never echoed."
  returns:
    description: "A token greater than 0 that can be matched against the commit token\n value on a subsequent Recognized event, or 0 if the call was rejected\n outright e.g. based on the SDK-local rate limit (at most one successful\n commit per 100 ms per push stream)."
    type: "<xref href=\"int?alt=int&text=int\" data-throw-if-not-resolved=\"False\" />"
- uid: "com.microsoft.cognitiveservices.speech.audio.PushAudioInputStream.commit(int)"
