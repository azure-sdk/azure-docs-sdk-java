  syntax: "public String roleName()"
  desc: "Get the roleName property: The name of the AWS IAM role assumed for authentication. This is the role name only, not the full ARN; the IAM path is supplied separately via \\`rolePath\\`, so '/' is not permitted here."
  returns:
    description: "the roleName value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
- uid: "com.azure.resourcemanager.containerregistry.models.EcrAuthenticationProperties.rolePath()"
