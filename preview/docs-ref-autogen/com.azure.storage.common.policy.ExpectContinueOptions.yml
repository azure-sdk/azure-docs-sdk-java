- uid: "com.azure.storage.common.policy.ExpectContinueOptions.getContentLengthThreshold()"
  fullName: "com.azure.storage.common.policy.ExpectContinueOptions.getContentLengthThreshold()"
  name: "getContentLengthThreshold()"
  nameWithType: "ExpectContinueOptions.getContentLengthThreshold()"
  summary: "Gets the minimum request `Content-Length` for applying `Expect: 100-continue`."
  syntax: "public Long getContentLengthThreshold()"
  desc: "Gets the minimum request `Content-Length` for applying `Expect: 100-continue`. Requests whose body length is known and smaller than this value will not have the header applied. Requests whose body length cannot be determined ahead of time are always eligible for the header. Requests whose body is known to be empty never have the header applied."
  returns:
    description: "The threshold in bytes, or null if every request with a body is eligible."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/Long.html\">Long</a>"
