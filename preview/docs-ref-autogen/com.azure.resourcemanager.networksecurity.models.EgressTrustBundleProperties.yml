  fullName: "com.azure.resourcemanager.networksecurity.models.EgressTrustBundleProperties.bundleVersion()"
  name: "bundleVersion()"
  nameWithType: "EgressTrustBundleProperties.bundleVersion()"
  summary: "Get the bundle<wbr>Version property: Opaque identifier of this bundle's content."
  syntax: "public String bundleVersion()"
  desc: "Get the bundleVersion property: Opaque identifier of this bundle's content. It changes whenever the set of anchors changes and is stable otherwise, so a caller can record what a sandbox was provisioned with and detect drift without comparing certificate bytes."
