desc: "HTTP pipeline policy that decodes the storage structured message body returned for downloads when CRC64 content validation is active.\n\nThe policy decides when to opt in (via the context key), tells the service to encode the response (via the request header), constructs the decoder and the wrapper response, and translates decoder-level failures (malformed framing, CRC mismatch, premature end-of-stream) into reactive <xref uid=\"\" data-throw-if-not-resolved=\"false\" data-raw-source=\"IOException\"></xref> errors.\n\nThis policy uses <xref uid=\"\" data-throw-if-not-resolved=\"false\" data-raw-source=\"PER_RETRY\"></xref> semantics by default, so each retry produces a fresh response that this policy wraps with a fresh decoder. A CRC failure on one attempt cannot pollute another, and the storage download retry logic (`BlobAsyncClientBase.downloadStream...`) can resume by reissuing range requests; each new range response is validated end-to-end on its own.\n\nBecause the wrapped <xref uid=\"\" data-throw-if-not-resolved=\"false\" data-raw-source=\"StructuredMessageDecoder\"></xref> only releases payload bytes after the corresponding segment's CRC has been verified, the <xref uid=\"\" data-throw-if-not-resolved=\"false\" data-raw-source=\"DecodedResponse\"></xref>'s body Flux is guaranteed to contain only validated bytes – callers never see a byte that could later fail validation, even when retries are involved."
