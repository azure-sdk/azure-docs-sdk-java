  desc: "List evaluator diagnostics Returns immutable publication lineage for the specified evaluator. Time, evaluator-version, dimension, and type filters are intersected. Returns recorded changes from completed evaluator version writes. Historical backfill and diagnostic calculation jobs are not included.\n\n**Query Parameters**\n\n    | ------------------ | -------------- | -------- | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n    | Name               | Type           | Required | Description                                                                                                                                                                                                                                                                               |\n    | after              | String         | No       | A cursor for use in pagination. \\`after\\` is an object ID that defines your place in the list. For instance, if you make a list request and receive 100 objects, ending with obj\\_foo, your subsequent call can include after=obj\\_foo in order to fetch the next page of the list.       |\n    | before             | String         | No       | A cursor for use in pagination. \\`before\\` is an object ID that defines your place in the list. For instance, if you make a list request and receive 100 objects, ending with obj\\_foo, your subsequent call can include before=obj\\_foo in order to fetch the previous page of the list. |\n    | limit              | Integer        | No       | The maximum number of lineage entries to return, between 1 and 100. The default is 20.                                                                                                                                                                                                    |\n    | order              | String         | No       | Sort completed diagnostics by \\`occurred\\_at\\`, then diagnostic identifier. The default is \\`desc\\`. Allowed values: \"asc\", \"desc\".                                                                                                                                                       |\n    | start\\_time        | OffsetDateTime | No       | Inclusive lower bound for the diagnostic occurrence time, expressed as Unix seconds.                                                                                                                                                                                                      |\n    | end\\_time          | OffsetDateTime | No       | Inclusive upper bound for the diagnostic occurrence time, expressed as Unix seconds. Includes all entries occurring within that second.                                                                                                                                                   |\n    | evaluator\\_version | String         | No       | Filter lineage diagnostics by the exact published evaluator version.                                                                                                                                                                                                                      |\n    | dimension\\_id      | String         | No       | Filter completed diagnostics for one public rubric dimension identifier.                                                                                                                                                                                                                  |\n    | type               | List<String>   | No       | Filter by one or more completed diagnostic types by repeating the query parameter. Call <xref uid=\"com.azure.core.http.rest.RequestOptions.addQueryParam\" data-throw-if-not-resolved=\"false\" data-raw-source=\"RequestOptions#addQueryParam\"></xref> to add string to array.               |\n\nYou can add these to a request with <xref uid=\"com.azure.core.http.rest.RequestOptions.addQueryParam\" data-throw-if-not-resolved=\"false\" data-raw-source=\"RequestOptions#addQueryParam\"></xref>\n\n**Response Body Schema**\n\n```java\n{\n     type: String(version_created/dimension_added/dimension_updated/dimension_removed/definition_updated/health_computed) (Required)\n     id: String (Required)\n     evaluator_version: String (Required)\n     occurred_at: long (Required)\n     change_type: String(human_created/human_added/human_edited/human_removed/generated/regenerated/not_present_in_generated_rubric/generation_completed) (Required)\n     explanation: String (Optional)\n }\n```"
  returns:
    description: "a flat page of recorded evaluator changes and computed health snapshots as paginated response with\n <xref uid=\"com.azure.core.http.rest.PagedIterable\" data-throw-if-not-resolved=\"false\" data-raw-source=\"PagedIterable\"></xref>."
    type: "<xref href=\"com.azure.core.http.rest.PagedIterable?alt=com.azure.core.http.rest.PagedIterable&text=PagedIterable\" data-throw-if-not-resolved=\"False\" />&lt;<xref href=\"com.azure.core.util.BinaryData?alt=com.azure.core.util.BinaryData&text=BinaryData\" data-throw-if-not-resolved=\"False\" />&gt;"
