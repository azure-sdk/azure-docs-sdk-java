desc: "Represents options for a transfer operation whose content integrity can be validated. Implemented by the various upload and download option types so that transfer content validation can be configured agnostically across many different operations.\n\nThis allows application code to enable or inspect content validation without needing to special-case every concrete option type. For example, a helper can accept a <xref uid=\"com.azure.storage.common.ValidatableContent\" data-throw-if-not-resolved=\"false\" data-raw-source=\"ValidatableContent\"></xref> and apply a single <xref uid=\"com.azure.storage.common.ContentValidationAlgorithm\" data-throw-if-not-resolved=\"false\" data-raw-source=\"ContentValidationAlgorithm\"></xref> to any supported upload or download options instance."
