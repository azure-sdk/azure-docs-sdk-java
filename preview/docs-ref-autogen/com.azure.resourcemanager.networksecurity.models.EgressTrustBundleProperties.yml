    description: "the bundleVersion value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
- uid: "com.azure.resourcemanager.networksecurity.models.EgressTrustBundleProperties.cacheExpiresAt()"
  fullName: "com.azure.resourcemanager.networksecurity.models.EgressTrustBundleProperties.cacheExpiresAt()"
  name: "cacheExpiresAt()"
  nameWithType: "EgressTrustBundleProperties.cacheExpiresAt()"
  summary: "Get the cache<wbr>Expires<wbr>At property: The absolute deadline matching \\`cache<wbr>Validity<wbr>Seconds\\`."
  syntax: "public OffsetDateTime cacheExpiresAt()"
  desc: "Get the cacheExpiresAt property: The absolute deadline matching \\`cacheValiditySeconds\\`. A cached copy must not be used after this instant without re-reading. Reaching it means the earlier refresh was missed or failing; a caller that cannot obtain an acceptable bundle must fail or retry bring-up rather than silently skip anchor installation."
  returns:
    description: "the cacheExpiresAt value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/time/OffsetDateTime.html\">OffsetDateTime</a>"
- uid: "com.azure.resourcemanager.networksecurity.models.EgressTrustBundleProperties.cacheValiditySeconds()"
  fullName: "com.azure.resourcemanager.networksecurity.models.EgressTrustBundleProperties.cacheValiditySeconds()"
  name: "cacheValiditySeconds()"
  nameWithType: "EgressTrustBundleProperties.cacheValiditySeconds()"
  summary: "Get the cache<wbr>Validity<wbr>Seconds property: How long, in seconds, a caller may serve this bundle from its own cache."
  syntax: "public int cacheValiditySeconds()"
  desc: "Get the cacheValiditySeconds property: How long, in seconds, a caller may serve this bundle from its own cache. This is a ceiling, not a target: refresh well before it elapses, at roughly half this value, so a transient failure still leaves time to retry before the cached copy must be discarded. The service sets this value and may change it to steer how often callers re-read, so honour the value returned rather than hard-coding an interval. Callers are expected to cache; a synchronous dependency on this operation during every sandbox launch is not intended."
  returns:
    description: "the cacheValiditySeconds value."
    type: "<xref href=\"int?alt=int&text=int\" data-throw-if-not-resolved=\"False\" />"
