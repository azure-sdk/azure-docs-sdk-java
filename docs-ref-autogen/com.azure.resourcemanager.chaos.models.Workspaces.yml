- uid: "com.azure.resourcemanager.chaos.models.Workspaces.evaluate(java.lang.String,java.lang.String)"
  fullName: "com.azure.resourcemanager.chaos.models.Workspaces.evaluate(String resourceGroupName, String workspaceName)"
  name: "evaluate(String resourceGroupName, String workspaceName)"
  nameWithType: "Workspaces.evaluate(String resourceGroupName, String workspaceName)"
  summary: "Starts evaluation of published scenario-template versions, including when the workspace has no scenarios."
  modifiers:
  - "abstract"
  parameters:
  - description: "The name of the resource group. The name is case insensitive."
    name: "resourceGroupName"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  - description: "String that represents a Workspace resource name."
    name: "workspaceName"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  syntax: "public abstract WorkspaceEvaluation evaluate(String resourceGroupName, String workspaceName)"
  desc: "Starts evaluation of published scenario-template versions, including when the workspace has no scenarios. Acceptance fixes the selected template membership and total count, qualified resource snapshot and canonical discovery result reference. Without a usable discovery snapshot or valid catalog input, the request is rejected synchronously with an Azure error and no evaluation result is created. A valid empty catalog completes successfully with zero counts and an empty results array. Outcome counts reflect processing after acceptance. The initial 202 has no body. Poll the operation-bound Location URL until completion: a completed successful or partially successful assessment returns the typed result; failed or canceled processing returns an Azure error whose target identifies the evaluation resource. Ordinary evaluation reads return the current resource, including failed or canceled results, while retained."
  returns:
    description: "a retained workspace evaluation of published scenario-template versions."
    type: "<xref href=\"com.azure.resourcemanager.chaos.models.WorkspaceEvaluation?alt=com.azure.resourcemanager.chaos.models.WorkspaceEvaluation&text=WorkspaceEvaluation\" data-throw-if-not-resolved=\"False\" />"
