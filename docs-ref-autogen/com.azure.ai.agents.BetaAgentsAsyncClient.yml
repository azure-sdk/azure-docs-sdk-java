cts, ending with obj\\_foo, your subsequent call can include before=obj\\_foo in order to fetch the previous page of the list. |\n    | status      | String  | No       | Filter to jobs in this lifecycle state. Allowed values: \"queued\", \"in\\_progress\", \"succeeded\", \"failed\", \"cancelled\".                                                                                                                                                                     |\n    | agent\\_name | String  | No       | Filter to jobs targeting this agent name.                                                                                                                                                                                                                                                 |\n\nYou can add these to a request with <xref uid=\"com.azure.core.http.rest.RequestOptions.addQueryParam\" data-throw-if-not-resolved=\"false\" data-raw-source=\"RequestOptions#addQueryParam\"></xref>\n\n**Response Body Schema**\n\n```java\n{\n     id: String (Required)\n     status: String(queued/in_progress/succeeded/failed/cancelled) (Required)\n     error (Optional): {\n         code: String (Required)\n         message: String (Required)\n         param: String (Optional)\n         type: String (Optional)\n         details (Optional): [\n             (recursive schema, see above)\n         ]\n         additionalInfo (Optional): {\n             String: BinaryData (Required)\n         }\n         debugInfo (Optional): {\n             String: BinaryData (Required)\n         }\n     }\n     created_at: long (Required)\n     updated_at: long (Required)\n     progress (Optional): {\n         candidates_completed: int (Required)\n         best_score: double (Required)\n         elapsed_seconds: double (Required)\n     }\n     agent (Optional): {\n         agent_name: String (Required)\n         agent_version: String (Optional)\n     }\n }\n```"
