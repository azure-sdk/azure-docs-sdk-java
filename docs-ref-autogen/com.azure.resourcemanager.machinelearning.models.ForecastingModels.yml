  name: "ARIMAX"
  nameWithType: "ForecastingModels.ARIMAX"
  summary: "An Autoregressive Integrated Moving Average with Explanatory Variable (ARIMAX) model can be viewed as a multiple regression model with one or more autoregressive (AR) terms and/or one or more moving average (MA) terms."
  modifiers:
  - "static"
  - "final"
  field:
