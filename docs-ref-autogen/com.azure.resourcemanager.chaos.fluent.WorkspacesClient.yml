- uid: "com.azure.resourcemanager.chaos.fluent.WorkspacesClient.beginEvaluate(java.lang.String,java.lang.String)"
  fullName: "com.azure.resourcemanager.chaos.fluent.WorkspacesClient.beginEvaluate(String resourceGroupName, String workspaceName)"
  name: "beginEvaluate(String resourceGroupName, String workspaceName)"
  nameWithType: "WorkspacesClient.beginEvaluate(String resourceGroupName, String workspaceName)"
  summary: "Starts evaluation of published scenario-template versions, including when the workspace has no scenarios."
  modifiers:
  - "abstract"
  parameters:
  - description: "The name of the resource group. The name is case insensitive."
    name: "resourceGroupName"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  - description: "String that represents a Workspace resource name."
