desc: "Represents a read-only room projection used to list rooms associated with a user. This model enables the standard resource operation to derive the \\`/api/hubs/\\{hub\\}/chat/users/\\{userId\\}/rooms\\` collection path because \\`ChatRoom\\` is a child of \\`Hub\\`, not \\`ChatUser\\`. This model does not define an independent room lifecycle."
