    name: "endpoint"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  - description: "The token credential used to acquire sessions."
    name: "credential"
    type: "<xref href=\"com.azure.core.credential.TokenCredential?alt=com.azure.core.credential.TokenCredential&text=TokenCredential\" data-throw-if-not-resolved=\"False\" />"
  syntax: "public SessionContext(String endpoint, TokenCredential credential)"
  desc: "Creates a session context with the endpoint and token credential used to acquire session credentials.\n\nSessions are disabled unless the mode is set to <xref uid=\"\" data-throw-if-not-resolved=\"false\" data-raw-source=\"SessionMode#ENABLED\"></xref>. These values override only the acquisition endpoint and credential; CreateSession requests still go through the consuming client's pipeline, and other requests use the consuming client's settings. The builder must still be configured with a <xref uid=\"com.azure.core.credential.TokenCredential\" data-throw-if-not-resolved=\"false\" data-raw-source=\"TokenCredential\"></xref>; supplying a credential here does not replace the builder's credential. Clients using this instance share a session cache, so share the context only across clients with compatible identity and network contexts. Use separate instances for independent caches."
