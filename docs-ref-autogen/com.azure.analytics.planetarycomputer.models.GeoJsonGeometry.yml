type: "class"
desc: "Represents a GeoJSON geometry object as defined by RFC 7946. Supported geometry types include: - \\*\\*Point\\*\\*: A single geographic coordinate. - \\*\\*LineString\\*\\*: A sequence of geographic coordinates forming a line. - \\*\\*Polygon\\*\\*: A closed shape defined by linear rings. - \\*\\*MultiPoint\\*\\*: A collection of Points. - \\*\\*MultiLineString\\*\\*: A collection of LineStrings. - \\*\\*MultiPolygon\\*\\*: A collection of Polygons. Used for spatial filtering in STAC."
