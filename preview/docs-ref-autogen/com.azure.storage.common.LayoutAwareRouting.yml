desc: "Defines the routing behavior the SDK should use when download hint metadata indicates blob layout is available.\n\nThis is a performance optimization only. The bytes returned are identical regardless of the mode used. Client-side encrypted blob clients do not support layout-aware routing and always use their configured endpoint. A warning is logged when <xref uid=\"com.azure.storage.common.LayoutAwareRouting.ENABLED\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#ENABLED\"></xref> is explicitly requested for an unsupported client."
