type: "class"
desc: "Configures session-based authentication for Blob and Data Lake clients.\n\nThe context is applied when a client builder constructs a pipeline with a <xref uid=\"com.azure.core.credential.TokenCredential\" data-throw-if-not-resolved=\"false\" data-raw-source=\"TokenCredential\"></xref>; a supplied <xref uid=\"com.azure.core.http.HttpPipeline\" data-throw-if-not-resolved=\"false\" data-raw-source=\"com.azure.core.http.HttpPipeline\"></xref> is used unchanged. The default mode is <xref uid=\"\" data-throw-if-not-resolved=\"false\" data-raw-source=\"SessionMode#AUTO\"></xref>, which currently disables sessions. Set <xref uid=\"com.azure.storage.blob.SessionContext.setSessionMode*\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#setSessionMode(SessionMode)\"></xref> to <xref uid=\"\" data-throw-if-not-resolved=\"false\" data-raw-source=\"SessionMode#ENABLED\"></xref> to enable them. Session authentication applies only to eligible GET blob requests. Other requests, and requests for which session acquisition fails, use bearer token authentication. Session-signed requests rejected with HTTP 401 are retried with bearer token authentication. Data Lake clients use sessions only through their underlying Blob pipeline, not the DFS pipeline.\n\nSession-enabled clients built with the same context instance share a session cache, including clients built later. Reuse this instance across clients targeting the same endpoint with compatible identity and network contexts to reuse cached sessions. Each client acquires sessions through its own pipeline.\n\nBy default, sessions are acquired using the consuming client's endpoint and credential. <xref uid=\"com.azure.storage.blob.SessionContext.SessionContext(java.lang.String,com.azure.core.credential.TokenCredential)\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#SessionContext(String, TokenCredential)\"></xref> overrides only the endpoint and credential used for session acquisition; the builder must still be configured with a <xref uid=\"com.azure.core.credential.TokenCredential\" data-throw-if-not-resolved=\"false\" data-raw-source=\"TokenCredential\"></xref>. Other requests continue to use the consuming client's settings.\n\nClients capture the session mode and account name when built. Changing these settings affects clients built afterward, not existing clients. The session cache remains shared; it is not copied when a client is built. Use separate context instances for independent caches.\n\n**Share sessions across independently built clients**\n\n```java\nString endpoint = \"https://account.blob.core.windows.net\";\n SessionContext sessionContext = new SessionContext(endpoint, credential)\n     .setSessionMode(SessionContext.SessionMode.ENABLED);\n\n BlobServiceClient firstClient = new BlobServiceClientBuilder().endpoint(endpoint).credential(credential)\n     .httpClient(httpClient).sessionContext(sessionContext).buildClient();\n BlobServiceClient secondClient = new BlobServiceClientBuilder().endpoint(endpoint).credential(credential)\n     .httpClient(httpClient).sessionContext(sessionContext).buildClient();\n```"
