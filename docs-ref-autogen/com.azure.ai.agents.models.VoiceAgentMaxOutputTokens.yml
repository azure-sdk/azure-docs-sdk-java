desc: "An output-token limit for a voice agent, expressed as a token count or the model's maximum available output tokens.\n\nUse `VoiceAgentMaxOutputTokens.of(1024)` for a numeric limit or <xref uid=\"com.azure.ai.agents.models.VoiceAgentMaxOutputTokens.MAXIMUM\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#MAXIMUM\"></xref> for the `\"inf\"` variant. The same type can be used with `setMaxOutputTokens` and `setMaxResponseOutputTokens`. Pass `null` to a model's setter to clear the property.\n\nUnrecognized string values read from JSON are preserved when serialized again. For those values, <xref uid=\"com.azure.ai.agents.models.VoiceAgentMaxOutputTokens.asInteger()\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#asInteger()\"></xref> returns `null` and <xref uid=\"com.azure.ai.agents.models.VoiceAgentMaxOutputTokens.isMaximum()\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#isMaximum()\"></xref> returns `false`."
