  desc: "Create an agent optimization job Creates an optimization job and returns the queued job. Honors \\`Operation-Id\\` for idempotent retry.\n\n**Header Parameters**\n\n    | ------------ | ------ | -------- | ----------------------------------------------------------------------------------------------------------- |\n    | Name         | Type   | Required | Description                                                                                                 |\n    | Operation-Id | String | No       | Client-generated unique ID for idempotent retries. When absent, the server creates the job unconditionally. |\n\nYou can add these to a request with <xref uid=\"com.azure.core.http.rest.RequestOptions.addHeader\" data-throw-if-not-resolved=\"false\" data-raw-source=\"RequestOptions#addHeader\"></xref>\n\n**Request Body Schema**\n\n```java\n{\n     id: String (Required)\n     inputs (Optional): {\n         agent (Required): {\n             agent_name: String (Required)\n             agent_version: String (Optional)\n         }\n         train_dataset (Required): {\n             type: String(inline/reference) (Required)\n         }\n         validation_dataset (Optional): (recursive schema, see validation_dataset above)\n         evaluators (Required): [\n              (Required){\n                 name: String (Required)\n                 version: String (Optional)\n             }\n         ]\n         options (Optional): {\n             max_candidates: Integer (Optional)\n             optimization_config (Optional): {\n                 String: BinaryData (Required)\n             }\n             eval_model: String (Optional)\n             optimization_model: String (Optional)\n             evaluation_level: String(turn/conversation) (Optional)\n             max_stalls: Integer (Optional)\n         }\n     }\n     result (Optional): {\n         baseline: String (Optional)\n         best: String (Optional)\n         candidates (Optional): [\n              (Optional){\n                 candidate_id: String (Optional)\n                 name: String (Required)\n                 mutations (Optional): {\n                     String: BinaryData (Required)\n                 }\n                 avg_score: double (Required)\n                 avg_tokens: double (Required)\n                 eval_id: String (Optional)\n                 eval_run_id: String (Optional)\n                 promotion (Optional): {\n                     promoted_at: long (Required)\n                     agent_name: String (Required)\n                     agent_version: String (Required)\n                 }\n             }\n         ]\n     }\n     status: String(queued/in_progress/succeeded/failed/cancelled) (Required)\n     error (Optional): {\n         code: String (Required)\n         message: String (Required)\n         param: String (Optional)\n         type: String (Optional)\n         details (Optional): [\n             (recursive schema, see above)\n         ]\n         additionalInfo (Optional): {\n             String: BinaryData (Required)\n         }\n         debugInfo (Optional): {\n             String: BinaryData (Required)\n         }\n     }\n     created_at: long (Required)\n     updated_at: long (Required)\n     progress (Optional): {\n         candidates_completed: int (Required)\n         best_score: double (Required)\n         elapsed_seconds: double (Required)\n     }\n     warnings (Optional): [\n         String (Optional)\n     ]\n }\n```\n\n**Response Body Schema**\n\n```java\n{\n     id: String (Required)\n     inputs (Optional): {\n         agent (Required): {\n             agent_name: String (Required)\n             agent_version: String (Optional)\n         }\n         train_dataset (Required): {\n             type: String(inline/reference) (Required)\n         }\n         validation_dataset (Optional): (recursive schema, see validation_dataset above)\n         evaluators (Required): [\n              (Required){\n                 name: String (Required)\n                 version: String (Optional)\n             }\n         ]\n         options (Optional): {\n             max_candidates: Integer (Optional)\n             optimization_config (Optional): {\n                 String: BinaryData (Required)\n             }\n             eval_model: String (Optional)\n             optimization_model: String (Optional)\n             evaluation_level: String(turn/conversation) (Optional)\n             max_stalls: Integer (Optional)\n         }\n     }\n     result (Optional): {\n         baseline: String (Optional)\n         best: String (Optional)\n         candidates (Optional): [\n              (Optional){\n                 candidate_id: String (Optional)\n                 name: String (Required)\n                 mutations (Optional): {\n                     String: BinaryData (Required)\n                 }\n                 avg_score: double (Required)\n                 avg_tokens: double (Required)\n                 eval_id: String (Optional)\n                 eval_run_id: String (Optional)\n                 promotion (Optional): {\n                     promoted_at: long (Required)\n                     agent_name: String (Required)\n                     agent_version: String (Required)\n                 }\n             }\n         ]\n     }\n     status: String(queued/in_progress/succeeded/failed/cancelled) (Required)\n     error (Optional): {\n         code: String (Required)\n         message: String (Required)\n         param: String (Optional)\n         type: String (Optional)\n         details (Optional): [\n             (recursive schema, see above)\n         ]\n         additionalInfo (Optional): {\n             String: BinaryData (Required)\n         }\n         debugInfo (Optional): {\n             String: BinaryData (Required)\n         }\n     }\n     created_at: long (Required)\n     updated_at: long (Required)\n     progress (Optional): {\n         candidates_completed: int (Required)\n         best_score: double (Required)\n         elapsed_seconds: double (Required)\n     }\n     warnings (Optional): [\n         String (Optional)\n     ]\n }\n```"
  returns:
