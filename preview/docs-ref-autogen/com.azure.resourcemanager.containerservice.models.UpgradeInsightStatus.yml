type: "class"
desc: "The overall status of an upgrade insight readiness evaluation. This is an aggregation of the per-issue \\`severity\\` values in \\`detectedIssues\\`: any \\`Blocking\\` issue ⇒ \\`Failed\\`; otherwise any \\`Warning\\` issue ⇒ \\`Warning\\`; otherwise (no issues) ⇒ \\`Passed\\`. The scope-level vocabulary here (Passed/Warning/Failed) intentionally differs from the issue-level \\`UpgradeIssueSeverity\\` (Blocking/Warning): a \\`Blocking\\` issue maps to a \\`Failed\\` status, while \\`Warning\\` maps through unchanged."
