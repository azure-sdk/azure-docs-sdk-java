    type: "<xref href=\"com.azure.resourcemanager.cognitiveservices.models.CostControlPatch?alt=com.azure.resourcemanager.cognitiveservices.models.CostControlPatch&text=CostControlPatch\" data-throw-if-not-resolved=\"False\" />"
