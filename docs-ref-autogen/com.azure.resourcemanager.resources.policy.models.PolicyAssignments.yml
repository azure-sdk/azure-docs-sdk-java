- uid: "com.azure.resourcemanager.resources.policy.models.PolicyAssignments.list()"
  fullName: "com.azure.resourcemanager.resources.policy.models.PolicyAssignments.list()"
  name: "list()"
  nameWithType: "PolicyAssignments.list()"
  summary: "Retrieves all policy assignments that apply to a subscription."
  modifiers:
  - "abstract"
  syntax: "public abstract PagedIterable<PolicyAssignment> list()"
  desc: "Retrieves all policy assignments that apply to a subscription. This operation retrieves the list of all policy assignments associated with the given subscription that match the optional given $filter. Valid values for $filter are: 'atScope()', 'atExactScope()' or 'policyDefinitionId eq '\\{value\\}''. If $filter is not provided, the unfiltered list includes all policy assignments associated with the subscription, including those that apply directly or from management groups that contain the given subscription, as well as any applied to objects contained within the subscription. If $filter=atScope() is provided, the returned list includes all policy assignments that apply to the subscription, which is everything in the unfiltered list except those applied to objects contained within the subscription. If $filter=atExactScope() is provided, the returned list only includes all policy assignments that at the subscription. If $filter=policyDefinitionId eq '\\{value\\}' is provided, the returned list includes all policy assignments of the policy definition whose id is \\{value\\}."
  returns:
    description: "the response of a PolicyAssignment list operation as paginated response with <xref uid=\"com.azure.core.http.rest.PagedIterable\" data-throw-if-not-resolved=\"false\" data-raw-source=\"PagedIterable\"></xref>."
    type: "<xref href=\"com.azure.core.http.rest.PagedIterable?alt=com.azure.core.http.rest.PagedIterable&text=PagedIterable\" data-throw-if-not-resolved=\"False\" />&lt;<xref href=\"com.azure.resourcemanager.resources.policy.models.PolicyAssignment?alt=com.azure.resourcemanager.resources.policy.models.PolicyAssignment&text=PolicyAssignment\" data-throw-if-not-resolved=\"False\" />&gt;"
