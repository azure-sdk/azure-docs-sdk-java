  syntax: "public static final ForecastingModels ARIMAX"
  desc: "An Autoregressive Integrated Moving Average with Explanatory Variable (ARIMAX) model can be viewed as a multiple regression model with one or more autoregressive (AR) terms and/or one or more moving average (MA) terms. This method is suitable for forecasting when data is stationary/non stationary, and multivariate with any type of data pattern, i.e., level/trend /seasonality/cyclicity."
- uid: "com.azure.resourcemanager.machinelearning.models.ForecastingModels.AUTO_ARIMA"
