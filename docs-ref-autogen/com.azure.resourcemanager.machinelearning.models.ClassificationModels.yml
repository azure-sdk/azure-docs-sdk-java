  syntax: "public static final ClassificationModels MULTINOMIAL_NAIVE_BAYES"
  desc: "The multinomial Naive Bayes classifier is suitable for classification with discrete features (e.g., word counts for text classification). The multinomial distribution normally requires integer feature counts. However, in practice, fractional counts such as tf-idf may also work."
- uid: "com.azure.resourcemanager.machinelearning.models.ClassificationModels.RANDOM_FOREST"
