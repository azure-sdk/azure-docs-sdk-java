- uid: "com.azure.resourcemanager.chaos.models.ScenarioTemplateVersionProperties.failureBehavior()"
  fullName: "com.azure.resourcemanager.chaos.models.ScenarioTemplateVersionProperties.failureBehavior()"
  name: "failureBehavior()"
  nameWithType: "ScenarioTemplateVersionProperties.failureBehavior()"
  summary: "Get the failure<wbr>Behavior property: Template-wide default for how a scenario run reacts when one of this template's actions fails."
  syntax: "public FailureBehavior failureBehavior()"
  desc: "Get the failureBehavior property: Template-wide default for how a scenario run reacts when one of this template's actions fails. An action that does not carry its own \\`failureBehavior\\` inherits this value; when neither is present the effective behavior is \\`Stop\\`. A scenario created from this template takes this policy with the rest of the template's structure, so it is also the scenario's resolved \\`failureBehavior\\`. Template versions published before this policy existed do not carry one and report it as absent, which the run resolves as \\`Stop\\`."
  returns:
    description: "the failureBehavior value."
    type: "<xref href=\"com.azure.resourcemanager.chaos.models.FailureBehavior?alt=com.azure.resourcemanager.chaos.models.FailureBehavior&text=FailureBehavior\" data-throw-if-not-resolved=\"False\" />"
