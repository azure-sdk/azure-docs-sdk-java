  desc: "The <xref uid=\"\" data-throw-if-not-resolved=\"false\" data-raw-source=\"com.azure.core.util.Context\"></xref> data key used to opt a request into locality-aware routing. When present and set to a non-null, non-empty endpoint string, this policy rewrites the outgoing request's host/port to that endpoint. The endpoint may be a bare `host[:port]` or a full URL."
