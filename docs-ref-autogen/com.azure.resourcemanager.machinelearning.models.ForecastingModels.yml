  - "final"
  field:
    type: "<xref href=\"com.azure.resourcemanager.machinelearning.models.ForecastingModels?alt=com.azure.resourcemanager.machinelearning.models.ForecastingModels&text=ForecastingModels\" data-throw-if-not-resolved=\"False\" />"
  syntax: "public static final ForecastingModels AUTO_ARIMA"
  desc: "Auto-Autoregressive Integrated Moving Average (ARIMA) model uses time-series data and statistical analysis to interpret the data and make future predictions. This model aims to explain data by using time series data on its past values and uses linear regression to make predictions."
