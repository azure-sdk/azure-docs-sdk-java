  fullName: "com.azure.resourcemanager.chaos.models.WorkspaceEncryption.customerManagedKeyEncryption()"
  name: "customerManagedKeyEncryption()"
  nameWithType: "WorkspaceEncryption.customerManagedKeyEncryption()"
  summary: "Get the customer<wbr>Managed<wbr>Key<wbr>Encryption property: The requested customer-managed key."
  syntax: "public WorkspaceCustomerManagedKeyEncryption customerManagedKeyEncryption()"
  desc: "Get the customerManagedKeyEncryption property: The requested customer-managed key. Its presence is fixed by accepted Workspace creation: adding CMK to a Microsoft-managed Workspace or removing CMK from a CMK-created Workspace is rejected with InvalidEncryptionConfiguration. The key pair remains updateable on CMK-created Workspaces, including after a failed creation. A present object requires a coherent keyEncryptionKeyUrl and keyVaultResourceId pair. After synchronous caller and vault validation, the accepted pair can be returned while configuration is Pending. It does not prove that active data already uses the requested key."
  returns:
    description: "the customerManagedKeyEncryption value."
    type: "<xref href=\"com.azure.resourcemanager.chaos.models.WorkspaceCustomerManagedKeyEncryption?alt=com.azure.resourcemanager.chaos.models.WorkspaceCustomerManagedKeyEncryption&text=WorkspaceCustomerManagedKeyEncryption\" data-throw-if-not-resolved=\"False\" />"
