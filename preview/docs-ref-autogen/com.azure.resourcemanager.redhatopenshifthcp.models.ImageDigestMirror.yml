  name: "source()"
  nameWithType: "ImageDigestMirror.source()"
  summary: "Get the source property: source matches the repository that users refer to, e.<wbr>g."
  syntax: "public String source()"
  desc: "Get the source property: source matches the repository that users refer to, e.g. in image pull specifications. Setting source to a registry hostname, e.g. docker.io, quay.io, or registry.redhat.io, will match the image pull specification of the corresponding registry. source uses one of the following formats: \\* host\\[:port\\] \\* host\\[:port\\]/namespace\\[/namespace...\\] \\* host\\[:port\\]/namespace\\[/namespace...\\]/repo \\* \\[\\*.\\]host for more information about the format, see: https://github.com/containers/image/blob/main/docs/containers-registries.conf.5.md\\#choosing-a-registry-toml-table."
  returns:
    description: "the source value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
