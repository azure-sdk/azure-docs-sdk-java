fields:
- uid: "com.azure.storage.common.policy.ExpectContinueMode.APPLY_ON_THROTTLE"
  fullName: "com.azure.storage.common.policy.ExpectContinueMode.APPLY_ON_THROTTLE"
  name: "APPLY_ON_THROTTLE"
  nameWithType: "ExpectContinueMode.APPLY_ON_THROTTLE"
  summary: "Tells the pipeline to apply `Expect: 100-continue` only after the service has recently indicated that it is under load, and to keep applying it until a period of time has passed since the last such response."
  desc: "Tells the pipeline to apply `Expect: 100-continue` only after the service has recently indicated that it is under load, and to keep applying it until a period of time has passed since the last such response.\n\nResponse codes that trigger this behavior are 429, 500, and 503.\n\nThis is the default mode of <xref uid=\"com.azure.storage.common.policy.ExpectContinueOptions\" data-throw-if-not-resolved=\"false\" data-raw-source=\"ExpectContinueOptions\"></xref>. The header is not applied unless options are explicitly supplied to a client builder."
- uid: "com.azure.storage.common.policy.ExpectContinueMode.OFF"
  fullName: "com.azure.storage.common.policy.ExpectContinueMode.OFF"
  name: "OFF"
  nameWithType: "ExpectContinueMode.OFF"
  summary: "Tells the pipeline to never apply `Expect: 100-continue`."
  desc: "Tells the pipeline to never apply `Expect: 100-continue`."
- uid: "com.azure.storage.common.policy.ExpectContinueMode.ON"
  fullName: "com.azure.storage.common.policy.ExpectContinueMode.ON"
  name: "ON"
  nameWithType: "ExpectContinueMode.ON"
  summary: "Tells the pipeline to apply `Expect: 100-continue` regardless of recent error status."
  desc: "Tells the pipeline to apply `Expect: 100-continue` regardless of recent error status. The header is still subject to <xref uid=\"com.azure.storage.common.policy.ExpectContinueOptions.getContentLengthThreshold()\" data-throw-if-not-resolved=\"false\" data-raw-source=\"ExpectContinueOptions#getContentLengthThreshold()\"></xref>."
