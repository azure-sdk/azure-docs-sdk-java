- uid: "com.azure.ai.projects.DatasetsAsyncClient.beginCreateGenerationJob(com.azure.core.util.BinaryData,com.azure.core.http.rest.RequestOptions)"
  fullName: "com.azure.ai.projects.DatasetsAsyncClient.beginCreateGenerationJob(BinaryData job, RequestOptions requestOptions)"
  name: "beginCreateGenerationJob(BinaryData job, RequestOptions requestOptions)"
  nameWithType: "DatasetsAsyncClient.beginCreateGenerationJob(BinaryData job, RequestOptions requestOptions)"
  summary: "Create a data generation job Submits a new data generation job for asynchronous execution."
  parameters:
  - description: "The data generation job inputs to create."
    name: "job"
    type: "<xref href=\"com.azure.core.util.BinaryData?alt=com.azure.core.util.BinaryData&text=BinaryData\" data-throw-if-not-resolved=\"False\" />"
  - description: "The options to configure the HTTP request before HTTP client sends it."
    name: "requestOptions"
    type: "<xref href=\"com.azure.core.http.rest.RequestOptions?alt=com.azure.core.http.rest.RequestOptions&text=RequestOptions\" data-throw-if-not-resolved=\"False\" />"
  syntax: "public PollerFlux<BinaryData,BinaryData> beginCreateGenerationJob(BinaryData job, RequestOptions requestOptions)"
  desc: "Create a data generation job Submits a new data generation job for asynchronous execution.\n\n**Header Parameters**\n\n    | ------------ | ------ | -------- | ----------------------------------------------------------------------------------------------------------- |\n    | Name         | Type   | Required | Description                                                                                                 |\n    | Operation-Id | String | No       | Client-generated unique ID for idempotent retries. When absent, the server creates the job unconditionally. |\n\nYou can add these to a request with <xref uid=\"com.azure.core.http.rest.RequestOptions.addHeader\" data-throw-if-not-resolved=\"false\" data-raw-source=\"RequestOptions#addHeader\"></xref>\n\n**Request Body Schema**\n\n```java\n{\n     scenario: String(supervised_finetuning_preview/reinforcement_finetuning_preview/evaluation) (Required)\n     name: String (Required)\n     sources (Required): [\n          (Required){\n             type: String(prompt/agent/traces/file) (Required)\n             description: String (Optional)\n         }\n     ]\n     generation_configuration (Required): {\n         type: String(simple_qna/traces/tool_use/simulation_seed) (Required)\n         train_split: Double (Optional)\n         model_options (Optional): {\n             model: String (Required)\n         }\n     }\n }\n```\n\n**Response Body Schema**\n\n```java\n{\n     scenario: String(supervised_finetuning_preview/reinforcement_finetuning_preview/evaluation) (Required)\n     id: String (Required)\n     result (Optional): {\n         outputs (Optional): [\n              (Optional){\n                 type: String(file/dataset) (Required)\n             }\n         ]\n         generated_samples: int (Required)\n         token_usage (Optional): {\n             prompt_tokens: long (Required)\n             completion_tokens: long (Required)\n             total_tokens: long (Required)\n         }\n     }\n     status: String(queued/in_progress/succeeded/failed/cancelled) (Required)\n     error (Optional): {\n         code: String (Required)\n         message: String (Required)\n         param: String (Optional)\n         type: String (Optional)\n         misalignment (Optional): {\n             error_type: String(potentially_unintended_data_transfer/potentially_unintended_data_access/potentially_unintended_destructive_activity/other) (Optional)\n             detailed_explanation: String (Optional)\n             steer (Optional): {\n                 message: String (Required)\n             }\n         }\n         details (Optional): [\n             (recursive schema, see above)\n         ]\n         additionalInfo (Optional): {\n             String: BinaryData (Required)\n         }\n         debugInfo (Optional): {\n             String: BinaryData (Required)\n         }\n     }\n     name: String (Required)\n     sources (Required): [\n          (Required){\n             type: String(prompt/agent/traces/file) (Required)\n             description: String (Optional)\n         }\n     ]\n     generation_configuration (Required): {\n         type: String(simple_qna/traces/tool_use/simulation_seed) (Required)\n         train_split: Double (Optional)\n         model_options (Optional): {\n             model: String (Required)\n         }\n     }\n     created_at: long (Required)\n     finished_at: Long (Optional)\n }\n```"
  returns:
    description: "the <xref uid=\"com.azure.core.util.polling.PollerFlux\" data-throw-if-not-resolved=\"false\" data-raw-source=\"PollerFlux\"></xref> for polling of data Generation Job resource."
    type: "<xref href=\"com.azure.core.util.polling.PollerFlux?alt=com.azure.core.util.polling.PollerFlux&text=PollerFlux\" data-throw-if-not-resolved=\"False\" />&lt;<xref href=\"com.azure.core.util.BinaryData?alt=com.azure.core.util.BinaryData&text=BinaryData\" data-throw-if-not-resolved=\"False\" />,<xref href=\"com.azure.core.util.BinaryData?alt=com.azure.core.util.BinaryData&text=BinaryData\" data-throw-if-not-resolved=\"False\" />&gt;"
