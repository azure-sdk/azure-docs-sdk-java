  summary: "Get the application<wbr>Id property: The Microsoft Entra application ID used for customer consent, returned for existing Workspaces, including Microsoft-managed Workspaces."
  syntax: "public String applicationId()"
  desc: "Get the applicationId property: The Microsoft Entra application ID used for customer consent, returned for existing Workspaces, including Microsoft-managed Workspaces. This does not permit adding CMK to an existing Microsoft-managed Workspace. Before creating a Workspace with a customer key, obtain the application name and ID for the target cloud from the service onboarding documentation or Portal, then consent and grant key access. The configuring caller separately needs Microsoft.KeyVault/vaults/read on the referenced vault. GET returns the same application ID. This is not a service principal object ID or an identity selector. The Workspace's top-level identity does not select this application."
  returns:
    description: "the applicationId value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
