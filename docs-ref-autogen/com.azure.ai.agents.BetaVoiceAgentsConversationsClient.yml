- uid: "com.azure.ai.agents.BetaVoiceAgentsConversationsClient.getAgentConversationAudio(java.lang.String,java.lang.String)"
  fullName: "com.azure.ai.agents.BetaVoiceAgentsConversationsClient.getAgentConversationAudio(String agentName, String conversationId)"
  name: "getAgentConversationAudio(String agentName, String conversationId)"
  nameWithType: "BetaVoiceAgentsConversationsClient.getAgentConversationAudio(String agentName, String conversationId)"
  summary: "Get a voice agent conversation's merged recording metadata Returns metadata for the whole-call merged stereo recording (user audio on the left channel, agent audio on the right)."
  parameters:
  - description: "The name of the agent."
    name: "agentName"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  - description: "The id of the conversation whose merged recording metadata is retrieved."
    name: "conversationId"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  syntax: "public VoiceRecording getAgentConversationAudio(String agentName, String conversationId)"
  desc: "Get a voice agent conversation's merged recording metadata Returns metadata for the whole-call merged stereo recording (user audio on the left channel, agent audio on the right). The common metadata (format, sample rate, channels, channel layout, duration) is returned for both Foundry-managed and bring-your-own-storage (BYOS) recordings; for BYOS the response additionally includes \\`blob\\_uri\\`, the URI of the recording in the customer's own storage (no SAS) that the customer downloads with their own credentials. The recording is built once from the per-turn segments after persistence finalization succeeds. While the conversation is \\`in\\_progress\\`, this route returns retriable \\`409 Conflict\\` with \\`error.code = recording\\_not\\_ready\\` and a \\`Retry-After\\` header when retry guidance is available. When the conversation is \\`failed\\`, it returns terminal \\`409 Conflict\\` with \\`error.code = recording\\_unavailable\\`. For a \\`completed\\` conversation, metadata is available subject to the existing BYOS behavior. Requires the conversation to have persisted audio (\\`store = true\\`); otherwise returns \\`404\\`."
  returns:
    description: "a voice agent conversation's merged recording metadata\n\n Returns metadata for the whole-call merged stereo recording (user audio on the left channel, agent audio\n on the right)."
    type: "<xref href=\"com.azure.ai.agents.models.VoiceRecording?alt=com.azure.ai.agents.models.VoiceRecording&text=VoiceRecording\" data-throw-if-not-resolved=\"False\" />"
