- uid: "com.azure.resourcemanager.chaos.models.WorkspaceCustomerManagedKeyEncryption.keyEncryptionKeyUrl()"
  fullName: "com.azure.resourcemanager.chaos.models.WorkspaceCustomerManagedKeyEncryption.keyEncryptionKeyUrl()"
  name: "keyEncryptionKeyUrl()"
  nameWithType: "WorkspaceCustomerManagedKeyEncryption.keyEncryptionKeyUrl()"
  summary: "Get the key<wbr>Encryption<wbr>Key<wbr>Url property: The versionless HTTPS Key Vault key URI in the supported cloud and Workspace tenant."
  syntax: "public String keyEncryptionKeyUrl()"
  desc: "Get the keyEncryptionKeyUrl property: The versionless HTTPS Key Vault key URI in the supported cloud and Workspace tenant. The key vault must belong to the same Microsoft Entra tenant as the Workspace. Its HTTPS origin must match the vault referenced by keyVaultResourceId. The service validates the effective pair and caller vault-read permission synchronously through Azure Resource Manager before creating public operation metadata, accepting the configuration operation, persisting requested encryption, or changing Storage or customer data. Supports RSA keys in Azure Key Vault and RSA-HSM keys in Premium Key Vault, with key sizes of 2048, 3072, or 4096 bits. Premium RSA-HSM keys use the same vault URL. The separate Azure Managed HSM service is not supported; Managed HSM endpoints are rejected before operation acceptance. A key version, query string, or fragment is not permitted. Azure Storage follows key versions automatically. Keep the previous version available for at least 24 hours after rotation."
  returns:
    description: "the keyEncryptionKeyUrl value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
- uid: "com.azure.resourcemanager.chaos.models.WorkspaceCustomerManagedKeyEncryption.keyVaultResourceId()"
