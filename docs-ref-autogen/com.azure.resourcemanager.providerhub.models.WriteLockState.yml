  syntax: "public static final WriteLockState ENABLED"
  desc: "The write lock feature is enabled. Ensures that only one write-operation i.e., PUT, PATCH and DELETE, is allowed on a resource at any given time. Other concurrent write-operations, if any, will be rejected until the lock on the resource is released by the ongoing write-operation. The feature overrides the 'resourceConcurrencyControlOptions'."
