desc: "Package containing the inner data models for KoreAIArtemis. Kore.AgentPlatform Resource Provider for managing Kore AI Agent Platform Organizations and their Workspaces. Organizations are top-level tracked ARM resources. Each Organization is provisioned together with a default Workspace. Additional Workspaces are managed as a child proxy resource type under the Organization using the standard ARM verbs (PUT / DELETE / GET / LIST) on the workspace URL. Service-to-service authentication between Liftr and Kore uses federated Microsoft Entra credentials and is enforced at the runtime layer (not on the ARM surface)."
