type: "class"
desc: "Defines a function that assigns pseudo-random scores to documents for randomized ordering. Random scoring functions do not take a boost. A scoring profile with a random function cannot define text weights or other function types, and can contain only one random function. Random scoring replaces the query and vector similarity scores, including for hybrid queries, so results are returned in random order."
