  syntax: "public StacItemCollection getItemCollection(String collectionId)"
  desc: "Fetch features of the feature collection with id \\`collectionId\\`. Every feature in a dataset belongs to a collection. A dataset may consist of multiple feature collections. A feature collection is often a collection of features of a similar type, based on a common schema."
  returns:
    description: "https://github.com/radiantearth/stac-spec/blob/v1.0.0/item-spec/itemcollection-spec.md\n \n Represents a collection of STAC Items as a GeoJSON FeatureCollection."
    type: "<xref href=\"com.azure.analytics.planetarycomputer.models.StacItemCollection?alt=com.azure.analytics.planetarycomputer.models.StacItemCollection&text=StacItemCollection\" data-throw-if-not-resolved=\"False\" />"
- uid: "com.azure.analytics.planetarycomputer.StacClient.getItemCollection(java.lang.String,java.lang.Integer,java.util.List<java.lang.String>,java.lang.String,com.azure.analytics.planetarycomputer.models.StacAssetUrlSigningMode,java.lang.Integer,java.lang.String)"
  fullName: "com.azure.analytics.planetarycomputer.StacClient.getItemCollection(String collectionId, Integer limit, List<String> boundingBox, String datetime, StacAssetUrlSigningMode sign, Integer durationInMinutes, String token)"
  name: "getItemCollection(String collectionId, Integer limit, List<String> boundingBox, String datetime, StacAssetUrlSigningMode sign, Integer durationInMinutes, String token)"
  nameWithType: "StacClient.getItemCollection(String collectionId, Integer limit, List<String> boundingBox, String datetime, StacAssetUrlSigningMode sign, Integer durationInMinutes, String token)"
  summary: "Fetch features of the feature collection with id \\`collection<wbr>Id\\`."
  parameters:
  - description: "Catalog collection id."
    name: "collectionId"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  - description: "The optional limit parameter recommends the number of items that should be present in the response\n document.\n \n If the limit parameter value is greater than advertised limit maximum, the server must return the\n maximum possible number of items, rather than responding with an error.\n \n Only items are counted that are on the first level of the collection in the response document.\n Nested objects contained within the explicitly requested items must not be counted.\n \n Minimum = 1. Maximum = 10000. Default = 10."
    name: "limit"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/Integer.html\">Integer</a>"
  - description: "Only features that have a geometry that intersects the bounding box are selected.\n The bounding box is provided as four or six numbers, depending on whether the\n coordinate reference system includes a vertical axis (height or depth):\n \n - Lower left corner, coordinate axis 1\n - Lower left corner, coordinate axis 2\n - Minimum value, coordinate axis 3 (optional)\n - Upper right corner, coordinate axis 1\n - Upper right corner, coordinate axis 2\n - Maximum value, coordinate axis 3 (optional)\n \n The coordinate reference system of the values is WGS 84 longitude/latitude\n (http://www.opengis.net/def/crs/OGC/1.3/CRS84).\n \n For WGS 84 longitude/latitude the values are in most cases the sequence of\n minimum longitude, minimum latitude, maximum longitude and maximum latitude.\n However, in cases where the box spans the antimeridian the first value\n (west-most box edge) is larger than the third value (east-most box edge).\n \n If the vertical axis is included, the third and the sixth number are\n the bottom and the top of the 3-dimensional bounding box.\n \n If a feature has multiple spatial geometry properties, it is the decision of the\n server whether only a single spatial geometry property is used to determine\n the extent or all relevant geometries."
    name: "boundingBox"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/util/List.html\">List</a>&lt;<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>&gt;"
  - description: "Either a date-time or an interval, open or closed. Date and time expressions\n adhere to RFC 3339. Open intervals are expressed using double-dots.\n \n Examples:\n \n - A date-time: \"2018-02-12T23:20:50Z\"\n - A closed interval: \"2018-02-12T00:00:00Z/2018-03-18T12:31:12Z\"\n - Open intervals: \"2018-02-12T00:00:00Z/..\" or \"../2018-03-18T12:31:12Z\"\n \n Only features that have a temporal property that intersects the value of\n `datetime` are selected.\n \n If a feature has multiple temporal properties, it is the decision of the\n server whether only a single temporal property is used to determine\n the extent or all relevant temporal properties."
