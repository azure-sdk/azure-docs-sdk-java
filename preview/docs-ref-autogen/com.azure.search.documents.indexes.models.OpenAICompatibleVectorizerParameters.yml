  name: "getModelName()"
  nameWithType: "OpenAICompatibleVectorizerParameters.getModelName()"
  summary: "Get the model<wbr>Name property: The embedding profile, using the same model-name enum as native Azure OpenAI vectorizers."
  syntax: "public AzureOpenAIModelName getModelName()"
  desc: "Get the modelName property: The embedding profile, using the same model-name enum as native Azure OpenAI vectorizers. Only text-embedding-ada-002, text-embedding-3-small, and text-embedding-3-large are supported at runtime; chat names in the shared enum are rejected. Controls Search's limits and default dimensions; the outbound body omits model, so the URI or gateway must select the actual model. Arbitrary provider protocols are not supported."
  returns:
    description: "the modelName value."
    type: "<xref href=\"com.azure.search.documents.indexes.models.AzureOpenAIModelName?alt=com.azure.search.documents.indexes.models.AzureOpenAIModelName&text=AzureOpenAIModelName\" data-throw-if-not-resolved=\"False\" />"
