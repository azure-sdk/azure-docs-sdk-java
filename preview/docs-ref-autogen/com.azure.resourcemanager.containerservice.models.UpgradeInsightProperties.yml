desc: "The base properties of an upgrade insight. The concrete shape is determined by \\`upgradeType\\`, which is encoded in the resource name: single-scope evaluations (\\`ControlPlane\\`, \\`AgentPool\\`, \\`NodeImage\\`) carry a flat per-scope result, while a combined evaluation (\\`ControlPlaneAndAgentPools\\`) carries a nested control plane result plus a per-agent-pool array."
