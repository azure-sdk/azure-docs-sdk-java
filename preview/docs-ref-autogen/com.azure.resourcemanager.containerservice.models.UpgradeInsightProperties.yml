  summary: "Get the expires<wbr>At property: The UTC time at which this stored upgrade insight expires and is removed from the data store (currently \\`last<wbr>Evaluated<wbr>At\\` plus a 14-day retention window)."
  syntax: "public OffsetDateTime expiresAt()"
  desc: "Get the expiresAt property: The UTC time at which this stored upgrade insight expires and is removed from the data store (currently \\`lastEvaluatedAt\\` plus a 14-day retention window). After this time a GET for the resource returns 404 Not Found and it no longer appears in the list, indicating the caller should call the compute operation to produce a fresh evaluation. Exposing the expiry lets clients decide when to recompute without hardcoding the retention period."
  returns:
    description: "the expiresAt value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/time/OffsetDateTime.html\">OffsetDateTime</a>"
