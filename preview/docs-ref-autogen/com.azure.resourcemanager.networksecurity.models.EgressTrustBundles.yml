  desc: "Gets the egress TLS-inspection trust bundle for the fabric. The bundle changes rarely, so callers are expected to cache it for the advertised validity period rather than reading it per workload. To decide whether a cached copy is still current, compare \\`bundleVersion\\`: it is derived from the anchor set, so it changes exactly when the anchors change and is stable otherwise. Every read returns the full bundle together with refreshed cache metadata."
