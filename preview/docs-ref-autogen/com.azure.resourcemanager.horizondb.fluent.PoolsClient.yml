- uid: "com.azure.resourcemanager.horizondb.fluent.PoolsClient.restart(java.lang.String,java.lang.String,java.lang.String)"
  fullName: "com.azure.resourcemanager.horizondb.fluent.PoolsClient.restart(String resourceGroupName, String clusterName, String poolName)"
  name: "restart(String resourceGroupName, String clusterName, String poolName)"
  nameWithType: "PoolsClient.restart(String resourceGroupName, String clusterName, String poolName)"
  summary: "Restarts the PostgreSQL container on all allocated nodes in a ready HorizonDB pool and applies pending dynamic and static parameter changes."
  modifiers:
  - "abstract"
  parameters:
  - description: "The name of the resource group. The name is case insensitive."
    name: "resourceGroupName"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  - description: "The name of the HorizonDB cluster."
    name: "clusterName"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  - description: "The name of the HorizonDB pool."
    name: "poolName"
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
  syntax: "public abstract PoolInner restart(String resourceGroupName, String clusterName, String poolName)"
  desc: "Restarts the PostgreSQL container on all allocated nodes in a ready HorizonDB pool and applies pending dynamic and static parameter changes. This customer-initiated Restart is the only operation that applies static parameter changes or dynamic parameter changes requested with PendingReboot; Stop followed by Start and scheduled maintenance do not apply them. Power operations are supported only at pool scope in this API version; there is no cluster-level restart action. When the pool has no allocated nodes, the operation succeeds without restarting any nodes, pending changes are considered applied, parameterGroup.syncStatus becomes InSync, and the resulting configuration applies to nodes allocated later. The request fails with 409 Conflict when another operation is in progress or the pool is in any other incompatible state."
  returns:
    description: "represents the HorizonDB pool."
    type: "<xref href=\"com.azure.resourcemanager.horizondb.fluent.models.PoolInner?alt=com.azure.resourcemanager.horizondb.fluent.models.PoolInner&text=PoolInner\" data-throw-if-not-resolved=\"False\" />"
