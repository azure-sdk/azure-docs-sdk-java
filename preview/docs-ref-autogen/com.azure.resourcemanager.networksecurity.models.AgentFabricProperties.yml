- uid: "com.azure.resourcemanager.networksecurity.models.AgentFabricProperties.contentInspectionProfile()"
  fullName: "com.azure.resourcemanager.networksecurity.models.AgentFabricProperties.contentInspectionProfile()"
  name: "contentInspectionProfile()"
  nameWithType: "AgentFabricProperties.contentInspectionProfile()"
  summary: "Get the content<wbr>Inspection<wbr>Profile property: The connection to the customer's Azure Content Safety account."
  syntax: "public ContentInspectionProfile contentInspectionProfile()"
  desc: "Get the contentInspectionProfile property: The connection to the customer's Azure Content Safety account. For a new fabric created with API version \\`2026-10-07-preview\\` or later, omitting this profile or supplying \\{\\} requests no inspection capability and uses no platform-owned account or shared-key fallback. For an existing fabric, omitting the profile from PUT, including requests from older clients, or supplying \\{\\} preserves its customer-owned connection, legacy regional connection, or absence of connection. The empty object is a request for no connection change, not a stored replacement profile. Neither omission nor \\{\\} removes, probes, or creates a connection or cancels a pending connection update. Other Fabric fields and policy compatibility rules still apply. A nonempty request profile requires both endpoint and apiKey, even at the unchanged endpoint. PUT can rotate the key or replace the endpoint by supplying the complete pair. Tags- or identity-only PATCH requests cannot change this profile. Existing legacy fabrics without a profile retain their regional Content Safety endpoint and authentication path. Omission or \\{\\} triggers no connection probe, account-management call, key retrieval, or credential requirement. Supplying a complete profile explicitly configures a customer-owned connection; there is no automatic conversion or failed-connection fallback to regional credentials. The customer owns, pays for, and operates the account. The service does not create, reserve, manage, or delete it. The service validates new or changed endpoint/credential configuration and the required Content Safety API before activation; configuration alone does not indicate readiness or active policy enforcement. Unchanged configuration, GET, and list do not trigger a new validation request. A failed replacement preserves the existing connection and credential, including a legacy regional connection."
  returns:
    description: "the contentInspectionProfile value."
    type: "<xref href=\"com.azure.resourcemanager.networksecurity.models.ContentInspectionProfile?alt=com.azure.resourcemanager.networksecurity.models.ContentInspectionProfile&text=ContentInspectionProfile\" data-throw-if-not-resolved=\"False\" />"
- uid: "com.azure.resourcemanager.networksecurity.models.AgentFabricProperties.defaultPolicyGroups()"
  fullName: "com.azure.resourcemanager.networksecurity.models.AgentFabricProperties.defaultPolicyGroups()"
  name: "defaultPolicyGroups()"
  nameWithType: "AgentFabricProperties.defaultPolicyGroups()"
  summary: "Get the default<wbr>Policy<wbr>Groups property: The default policy groups to apply to all members of this fabric."
  syntax: "public List<String> defaultPolicyGroups()"
  desc: "Get the defaultPolicyGroups property: The default policy groups to apply to all members of this fabric. A fabric without a configured inspection connection cannot reference a group containing any ContentInspection policy, even when that policy's selectors currently match no traffic. For an existing fabric, compatibility uses the stored configuration when PUT omits contentInspectionProfile or supplies an empty object. Existing legacy fabrics retain their regional Content Safety connection, which satisfies the inspection prerequisite without new probes. A connection still being validated is not an absent connection. Removing a group reference remains allowed, subject to other validation."
  returns:
    description: "the defaultPolicyGroups value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/util/List.html\">List</a>&lt;<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>&gt;"
