- uid: "com.azure.resourcemanager.horizondb.models.ClusterProperties.pointInTimeUtc()"
  fullName: "com.azure.resourcemanager.horizondb.models.ClusterProperties.pointInTimeUtc()"
  name: "pointInTimeUtc()"
  nameWithType: "ClusterProperties.pointInTimeUtc()"
  summary: "Get the point<wbr>InTime<wbr>Utc property: The requested point in time, in UTC."
  syntax: "public OffsetDateTime pointInTimeUtc()"
  desc: "Get the pointInTimeUtc property: The requested point in time, in UTC. This property is required in every PointInTimeRestore request. For a same-location restore, the service restores the latest backup available at or before this value. For a cross-location restore, the service requires but ignores this value and restores the latest available backup; cross-location responses omit this property. This property must be absent for other creation modes or when creationMode is omitted and can only be specified during resource creation."
  returns:
    description: "the pointInTimeUtc value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/time/OffsetDateTime.html\">OffsetDateTime</a>"
- uid: "com.azure.resourcemanager.horizondb.models.ClusterProperties.postgreSqlVersion()"
  fullName: "com.azure.resourcemanager.horizondb.models.ClusterProperties.postgreSqlVersion()"
  name: "postgreSqlVersion()"
  nameWithType: "ClusterProperties.postgreSqlVersion()"
  summary: "Get the postgre<wbr>Sql<wbr>Version property: The PostgreSQL major version used by the HorizonDB cluster."
  syntax: "public PostgreSqlVersion postgreSqlVersion()"
  desc: "Get the postgreSqlVersion property: The PostgreSQL major version used by the HorizonDB cluster. API version 2026-10-01-preview supports versions 17 and 18. For ordinary cluster creation, the version is supplied in the request and is immutable after creation. For point-in-time restore, the service obtains the version from the source backup metadata and the request must omit this property. This API version does not support in-place PostgreSQL major-version upgrades."
  returns:
    description: "the postgreSqlVersion value."
    type: "<xref href=\"com.azure.resourcemanager.horizondb.models.PostgreSqlVersion?alt=com.azure.resourcemanager.horizondb.models.PostgreSqlVersion&text=PostgreSqlVersion\" data-throw-if-not-resolved=\"False\" />"
