  summary: "Get the acknowledgement<wbr>Delay property: Milliseconds to wait before requesting an automatic spoken acknowledgement for a delegation."
  syntax: "public Duration getAcknowledgementDelay()"
  desc: "Get the acknowledgementDelay property: Milliseconds to wait before requesting an automatic spoken acknowledgement for a delegation. The model may still speak before this delay. Any commentary or thinking appended to the session cancels all pending acknowledgements, including those for other delegations. Defaults to 400 for Decisions sessions and 0 (request immediately) for other sessions. Omission in a session update preserves the current value. Updates apply to subsequent delegations."
  returns:
    description: "the acknowledgementDelay value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/time/Duration.html\">Duration</a>"
