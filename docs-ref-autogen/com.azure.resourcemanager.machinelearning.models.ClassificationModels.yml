  syntax: "public static final ClassificationModels LINEAR_SVM"
  desc: "A support vector machine (SVM) is a supervised machine learning model that uses classification algorithms for two-group classification problems. After giving an SVM model sets of labeled training data for each category, they're able to categorize new text. Linear SVM performs best when input data is linear, i.e., data can be easily classified by drawing the straight line between classified values on a plotted graph."
- uid: "com.azure.resourcemanager.machinelearning.models.ClassificationModels.LOGISTIC_REGRESSION"
