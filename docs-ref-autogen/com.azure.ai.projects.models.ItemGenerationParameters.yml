desc: "Configures how the service prepares input items for an evaluation run before applying testing criteria. Depending on \\`type\\`, preparation can generate new inputs, retrieve existing responses, transform source data, or simulate conversations. Each \\`type\\` selects a workflow-specific model with the parameters required by that preparation workflow. These parameters do not define the evaluated target or the testing criteria."
