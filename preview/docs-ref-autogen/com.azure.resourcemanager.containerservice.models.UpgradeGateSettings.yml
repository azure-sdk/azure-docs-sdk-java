  name: "enabled()"
  nameWithType: "UpgradeGateSettings.enabled()"
  summary: "Get the enabled property: Whether upgrade gating is enabled."
  syntax: "public Boolean enabled()"
  desc: "Get the enabled property: Whether upgrade gating is enabled. Defaults to \\`false\\` when unset, except on a newly created agent pool in a cluster where upgrade gating is enabled, which defaults to \\`true\\`. When \\`true\\`, upgrade-gated health checks are enabled for upgrades in the corresponding scope. Setting this to \\`true\\` at the cluster scope enables gating for the entire cluster, including all agent pool upgrades. When the cluster scope is unset or \\`false\\`, an agent pool can opt in independently by setting this to \\`true\\`. When the cluster scope is \\`true\\`, an agent pool cannot set this to \\`false\\`. Force upgrade (\\`overrideSettings.forceUpgrade\\`) overrides the gate: while the override window is active, the upgrade skips health signal validation and proceeds."
  returns:
    description: "the enabled value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/Boolean.html\">Boolean</a>"
