type: "class"
desc: "Voice output configuration. Inline subagents use it directly as their voice override, and the session-level output audio configuration extends it. Provider-specific fields are selected by \\`voice\\_type\\`: - \\`openai\\`: \\`voice\\` and \\`speed\\`. - \\`azure-standard\\`: \\`voice\\`, \\`voice\\_locale\\`, \\`speed\\`, \\`voice\\_temperature\\`, \\`custom\\_lexicon\\_url\\`, \\`custom\\_text\\_normalization\\_url\\`, \\`prefer\\_locales\\`, \\`style\\`, \\`pitch\\`, and \\`volume\\`. - \\`azure-custom\\`: all \\`azure-standard\\` fields except \\`style\\`, plus \\`custom\\_voice\\_endpoint\\_id\\`. - \\`azure-personal\\`: all \\`azure-standard\\` fields except \\`style\\`, plus \\`personal\\_voice\\_model\\`. - \\`avatar-voice-sync\\`: all \\`azure-standard\\` fields except \\`voice\\` and \\`style\\`, plus \\`personal\\_voice\\_model\\`; the voice name is derived from the avatar. - \\`azure-realtime-native\\`: \\`voice\\` and \\`speed\\`."
