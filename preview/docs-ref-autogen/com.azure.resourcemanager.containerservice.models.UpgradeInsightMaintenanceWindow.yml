desc: "A scheduled maintenance window during which an automatic upgrade of this type is expected to run. The window is derived from the maintenance configuration that governs this upgrade type — the cluster auto-upgrade schedule for Kubernetes version upgrades or the node OS upgrade schedule for node image upgrades — so the same model describes both without duplicating types."
