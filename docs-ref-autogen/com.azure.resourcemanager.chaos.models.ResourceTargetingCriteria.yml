type: "class"
desc: "Model that represents a set of targeting criteria for resource selection. Used on both the include and exclude sides of ResourceTargeting. All dimensions use unified null/empty semantics: - Null or omitted means \"no constraint\" (this dimension is inactive). - Empty array is treated the same as null (no constraint). - Non-empty array means the dimension is active."
