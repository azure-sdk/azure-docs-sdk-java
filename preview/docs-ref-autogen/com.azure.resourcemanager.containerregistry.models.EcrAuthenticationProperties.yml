  name: "rolePath()"
  nameWithType: "EcrAuthenticationProperties.rolePath()"
  summary: "Get the role<wbr>Path property: Optional IAM path of the role (for example \\`/team/\\` or \\`/division/team/\\`)."
  syntax: "public String rolePath()"
  desc: "Get the rolePath property: Optional IAM path of the role (for example \\`/team/\\` or \\`/division/team/\\`). The value must be supplied in canonical form with a leading and trailing '/'; it is validated as-is and is never normalized. A non-root path must contain at least one character between the surrounding slashes. When authentication is first configured, an omitted path defaults to the root (\\`/\\`). When updating an existing authentication configuration, an omitted path retains its current value."
  returns:
    description: "the rolePath value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
