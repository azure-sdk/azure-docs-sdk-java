  syntax: "public abstract UpgradeInsightInner generate(String resourceGroupName, String resourceName, GenerateUpgradeInsightsContent body)"
  desc: "Generates (or refreshes) an upgrade readiness evaluation for the managed cluster. The requested scope and target version(s) are supplied in the request body; the server runs the readiness checks — the control plane Kubernetes version upgrade, a single agent pool Kubernetes version upgrade, a single agent pool node OS image upgrade, or the combined control plane and agent pools upgrade — persists the result as an UpgradeInsight resource with a server-generated name, and returns that resource. The response body is identical to a subsequent GET of the resource."
  returns:
    description: "an upgrade insight for a managed cluster: an on-demand readiness evaluation for an\n upgrade scope, produced by the generateUpgradeInsights action on the managed cluster\n and addressable by a server-generated name."
    type: "<xref href=\"com.azure.resourcemanager.containerservice.fluent.models.UpgradeInsightInner?alt=com.azure.resourcemanager.containerservice.fluent.models.UpgradeInsightInner&text=UpgradeInsightInner\" data-throw-if-not-resolved=\"False\" />"
