desc: "Contextual information for a specific upgrade type (Kubernetes version or node OS image). Because the Kubernetes version and node OS image can be managed independently — for example, auto-upgrade for the node image but manual for the Kubernetes version — this context is reported per upgrade type rather than once for the whole cluster."
