  syntax: "public abstract SyncPoller<PollResult<ClusterInner>,ClusterInner> beginFailover(String resourceGroupName, String clusterName)"
  desc: "Triggers failover within the cluster's designated read-write pool. HorizonDB selects the replacement node using the same eligibility and node-selection rules as automatic failover. The request fails with 409 Conflict when the designated pool is not eligible for failover or another conflicting operation is in progress."
