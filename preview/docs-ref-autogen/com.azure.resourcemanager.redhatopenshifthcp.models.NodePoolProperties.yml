- uid: "com.azure.resourcemanager.redhatopenshifthcp.models.NodePoolProperties.nodeDrainTimeoutMinutes()"
  fullName: "com.azure.resourcemanager.redhatopenshifthcp.models.NodePoolProperties.nodeDrainTimeoutMinutes()"
  name: "nodeDrainTimeoutMinutes()"
  nameWithType: "NodePoolProperties.nodeDrainTimeoutMinutes()"
  summary: "Get the node<wbr>Drain<wbr>Timeout<wbr>Minutes property: node<wbr>Drain<wbr>Timeout<wbr>Minutes is the grace period for how long Pod Disruption Budget-protected workloads will be respected during any node draining operation."
  syntax: "public Integer nodeDrainTimeoutMinutes()"
  desc: "Get the nodeDrainTimeoutMinutes property: nodeDrainTimeoutMinutes is the grace period for how long Pod Disruption Budget-protected workloads will be respected during any node draining operation. After this grace period, any workloads protected by Pod Disruption Budgets that have not been successfully drained from a node will be forcibly evicted. This is especially relevant to cluster upgrades. Valid values are from 0 to 10080 minutes (1 week) . 0 means that the NodePool can be drained without any time limitation. If unset the cluster nodeDrainTimeoutMinutes value is used as a default."
  returns:
    description: "the nodeDrainTimeoutMinutes value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/Integer.html\">Integer</a>"
