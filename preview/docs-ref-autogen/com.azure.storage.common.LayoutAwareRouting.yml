fields:
- uid: "com.azure.storage.common.LayoutAwareRouting.AUTO"
  fullName: "com.azure.storage.common.LayoutAwareRouting.AUTO"
  name: "AUTO"
  nameWithType: "LayoutAwareRouting.AUTO"
  summary: "Let the SDK choose the routing behavior most appropriate for the request."
  desc: "Let the SDK choose the routing behavior most appropriate for the request.\n\nThe behavior selected by `AUTO` is an implementation detail and may change between SDK releases. Choose <xref uid=\"com.azure.storage.common.LayoutAwareRouting.DISABLED\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#DISABLED\"></xref> or <xref uid=\"com.azure.storage.common.LayoutAwareRouting.ENABLED\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#ENABLED\"></xref> explicitly if you require a specific behavior."
- uid: "com.azure.storage.common.LayoutAwareRouting.DISABLED"
  fullName: "com.azure.storage.common.LayoutAwareRouting.DISABLED"
  name: "DISABLED"
  nameWithType: "LayoutAwareRouting.DISABLED"
  summary: "Never use layout-aware routing."
  desc: "Never use layout-aware routing. The client always uses its configured endpoint."
- uid: "com.azure.storage.common.LayoutAwareRouting.ENABLED"
  fullName: "com.azure.storage.common.LayoutAwareRouting.ENABLED"
  name: "ENABLED"
  nameWithType: "LayoutAwareRouting.ENABLED"
  summary: "Opt in to layout-aware routing."
  desc: "Opt in to layout-aware routing. The client fetches blob layout on demand, caches it, and refreshes it in the background when needed.\n\nLayout-aware routing connects to the selected locality endpoint while preserving the original storage account authority in the `Host` header. When using the JDK HTTP transport, start the JVM with `-Djdk.httpclient.allowRestrictedHeaders=host` before the JDK HTTP client is initialized. If the property already specifies other headers, add `host` to its comma-separated list. Do not configure the JDK HTTP transport to use HTTP/2 for layout-aware routing, as its `:authority` remains derived from the request URL. This setting affects all JDK HTTP clients in the process. See the [JDK HTTP transport documentation][] for custom configuration and other limitations.\n\n\n[JDK HTTP transport documentation]: https://github.com/Azure/azure-sdk-for-java/blob/main/sdk/core/azure-core-http-jdk-httpclient/README.md#request-host-overrides"
