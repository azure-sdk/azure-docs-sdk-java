type: "class"
desc: "Pipeline policy that, when an ideal endpoint has been set on the per-call <xref uid=\"\" data-throw-if-not-resolved=\"false\" data-raw-source=\"com.azure.core.util.Context\"></xref> under <xref uid=\"com.azure.storage.common.policy.DataLocalityPolicy.LAYOUT_ENDPOINT_KEY\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#LAYOUT_ENDPOINT_KEY\"></xref>, rewrites the outgoing request's host and port to that endpoint while preserving the original host on the `Host` header.\n\nThis policy is a no-op for any request that does not opt in by setting the <xref uid=\"com.azure.storage.common.policy.DataLocalityPolicy.LAYOUT_ENDPOINT_KEY\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#LAYOUT_ENDPOINT_KEY\"></xref> property on the call context, for example via `context.addData(DataLocalityPolicy.LAYOUT_ENDPOINT_KEY, endpoint)` before issuing the request."
