type: "class"
desc: "A connection to a customer-owned Azure Content Safety account. Configuring the connection does not create or attach a ContentInspection policy or select traffic for inspection. The endpoint routes Content Safety calls; a key alone cannot identify the account endpoint. The customer supplies the key, so the service does not discover account keys through Azure Resource Manager or require permission to perform the account's listKeys action. Fields are schema-optional to allow an empty request object. Service cross-field validation requires both endpoint and apiKey in a nonempty request profile. Read responses contain only the endpoint; they are not complete connection-update inputs."
