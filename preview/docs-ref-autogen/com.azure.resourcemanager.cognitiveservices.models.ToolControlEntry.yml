  nameWithType: "ToolControlEntry.serverUrl()"
  summary: "Get the server<wbr>Url property: The absolute HTTPS URL or URL pattern of an MCP server, stored as a string to support wildcards."
  syntax: "public String serverUrl()"
  desc: "Get the serverUrl property: The absolute HTTPS URL or URL pattern of an MCP server, stored as a string to support wildcards. The entire URL may contain at most one literal '\\*' across its hostname, path, query, and fragment. Supported patterns include https://\\*.contoso.com/mcp, https://contoso.com/mcp/\\*, https://contoso.com/mcp?tenant=\\*, and https://contoso.com/mcp\\#\\*. A hostname wildcard must be the leftmost label. The URL must not contain user information. Applies only to type mcp and cannot be specified together with connectorId."
  returns:
    description: "the serverUrl value."
    type: "<a href=\"https://docs.oracle.com/javase/8/docs/api/java/lang/String.html\">String</a>"
