  name: "commit(int channelId)"
  nameWithType: "PushAudioInputStream.commit(int channelId)"
  summary: "Same as commit() but scoped to a single channel of a multichannel input."
  parameters:
  - description: "0-indexed channel identifier."
    name: "channelId"
    type: "<xref href=\"int?alt=int&text=int\" data-throw-if-not-resolved=\"False\" />"
  syntax: "public int commit(int channelId)"
  desc: "Same as commit() but scoped to a single channel of a multichannel input. The service acknowledges the commit on the named channel only."
  returns:
    description: "A token greater than 0, or 0 if the call was rejected."
    type: "<xref href=\"int?alt=int&text=int\" data-throw-if-not-resolved=\"False\" />"
