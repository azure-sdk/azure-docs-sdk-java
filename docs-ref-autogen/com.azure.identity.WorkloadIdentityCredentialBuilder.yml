type: "class"
desc: "Fluent credential builder for instantiating a <xref uid=\"com.azure.identity.WorkloadIdentityCredential\" data-throw-if-not-resolved=\"false\" data-raw-source=\"WorkloadIdentityCredential\"></xref>.\n\nWorkload identity authentication exchanges a projected Kubernetes service account token for a Microsoft Entra access token, without requiring an application secret or certificate. The credential reads its tenant ID, client ID, and token file path from the workload identity environment variables unless they are configured on this builder. Refer to [Microsoft Entra Workload ID][] for more information. To use Azure Kubernetes Service identity bindings, opt in with <xref uid=\"com.azure.identity.WorkloadIdentityCredentialBuilder.enableAzureProxy()\" data-throw-if-not-resolved=\"false\" data-raw-source=\"#enableAzureProxy()\"></xref>.\n\n**Sample: Construct WorkloadIdentityCredential**\n\nThe following code sample demonstrates the creation of a <xref uid=\"com.azure.identity.WorkloadIdentityCredential\" data-throw-if-not-resolved=\"false\" data-raw-source=\"WorkloadIdentityCredential\"></xref>, using the <xref uid=\"com.azure.identity.WorkloadIdentityCredentialBuilder\" data-throw-if-not-resolved=\"false\" data-raw-source=\"WorkloadIdentityCredentialBuilder\"></xref> to configure it. The `clientId`, is required to create <xref uid=\"com.azure.identity.WorkloadIdentityCredential\" data-throw-if-not-resolved=\"false\" data-raw-source=\"WorkloadIdentityCredential\"></xref>. Once this credential is created, it may be passed into the builder of many of the Azure SDK for Java client builders as the 'credential' parameter.\n\n```java\nTokenCredential workloadIdentityCredential = new WorkloadIdentityCredentialBuilder().clientId(\"<clientID>\")\n     .tenantId(\"<tenantID>\")\n     .tokenFilePath(\"<token-file-path>\")\n     .build();\n```\n\n\n[Microsoft Entra Workload ID]: https://learn.microsoft.com/azure/aks/workload-identity-overview"
metadata: {}
