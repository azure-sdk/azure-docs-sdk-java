- uid: "com.azure.resourcemanager.containerservice.models.CloudShellProfile.mode()"
  fullName: "com.azure.resourcemanager.containerservice.models.CloudShellProfile.mode()"
  name: "mode()"
  nameWithType: "CloudShellProfile.mode()"
  summary: "Get the mode property: Whether Cloud Shell connectivity is disabled, uses AKS-managed network resources, or uses user-provided network resources."
  syntax: "public CloudShellProfileMode mode()"
  desc: "Get the mode property: Whether Cloud Shell connectivity is disabled, uses AKS-managed network resources, or uses user-provided network resources. Defaults to Disabled when omitted during create. On update, omission preserves the existing mode. Setting this property to Disabled removes AKS-created resources and connectivity artifacts. For Custom mode, AKS unregisters the user-provided resources but does not delete them."
  returns:
    description: "the mode value."
    type: "<xref href=\"com.azure.resourcemanager.containerservice.models.CloudShellProfileMode?alt=com.azure.resourcemanager.containerservice.models.CloudShellProfileMode&text=CloudShellProfileMode\" data-throw-if-not-resolved=\"False\" />"
- uid: "com.azure.resourcemanager.containerservice.models.CloudShellProfile.network()"
  fullName: "com.azure.resourcemanager.containerservice.models.CloudShellProfile.network()"
  name: "network()"
  nameWithType: "CloudShellProfile.network()"
  summary: "Get the network property: Network resources used by Cloud Shell."
  syntax: "public CloudShellNetworkProfile network()"
  desc: "Get the network property: Network resources used by Cloud Shell. When configuring Custom networking, users must provide both subnetId and relayNamespaceId. When updating an existing Custom configuration, either resource ID can be changed independently; omitted fields preserve their existing values. In Custom mode, AKS returns the user-provided values. In Managed mode, AKS populates the effective values. Users may omit Managed values or resubmit values returned by GET unchanged; different values are rejected. This property must be omitted when mode is Disabled. See https://aka.ms/aks/CloudShellConnect for Custom networking requirements."
  returns:
    description: "the network value."
    type: "<xref href=\"com.azure.resourcemanager.containerservice.models.CloudShellNetworkProfile?alt=com.azure.resourcemanager.containerservice.models.CloudShellNetworkProfile&text=CloudShellNetworkProfile\" data-throw-if-not-resolved=\"False\" />"
- uid: "com.azure.resourcemanager.containerservice.models.CloudShellProfile.storage()"
  fullName: "com.azure.resourcemanager.containerservice.models.CloudShellProfile.storage()"
  name: "storage()"
  nameWithType: "CloudShellProfile.storage()"
  summary: "Get the storage property: Storage resources used for Cloud Shell file persistence."
  syntax: "public CloudShellStorageProfile storage()"
  desc: "Get the storage property: Storage resources used for Cloud Shell file persistence. When configuring Custom storage, users must provide both storageAccountId and fileShareName. When updating an existing Custom configuration, either property can be changed independently; omitted fields preserve their existing values. In Custom mode, AKS returns the user-provided values. In Managed mode, AKS populates the effective values. Users may omit Managed values or resubmit values returned by GET unchanged; different values are rejected. Both properties must be omitted when mode is Disabled. See https://aka.ms/aks/CloudShellConnect for Custom storage requirements."
  returns:
    description: "the storage value."
    type: "<xref href=\"com.azure.resourcemanager.containerservice.models.CloudShellStorageProfile?alt=com.azure.resourcemanager.containerservice.models.CloudShellStorageProfile&text=CloudShellStorageProfile\" data-throw-if-not-resolved=\"False\" />"
