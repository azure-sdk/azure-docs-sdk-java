- uid: "com.azure.resourcemanager.compute.models.CapacityReservationType.BLOCK"
  fullName: "com.azure.resourcemanager.compute.models.CapacityReservationType.BLOCK"
  name: "BLOCK"
  nameWithType: "CapacityReservationType.BLOCK"
  summary: "The virtual machine consumes capacity from a specific matching capacity reservation when associated with a capacity reservation group resource of type block, and will hit capacity failures if there is no available capacity in the block reservation."
  modifiers:
  - "static"
  - "final"
  field:
    type: "<xref href=\"com.azure.resourcemanager.compute.models.CapacityReservationType?alt=com.azure.resourcemanager.compute.models.CapacityReservationType&text=CapacityReservationType\" data-throw-if-not-resolved=\"False\" />"
  syntax: "public static final CapacityReservationType BLOCK"
  desc: "The virtual machine consumes capacity from a specific matching capacity reservation when associated with a capacity reservation group resource of type block, and will hit capacity failures if there is no available capacity in the block reservation."
- uid: "com.azure.resourcemanager.compute.models.CapacityReservationType.DISABLED"
  fullName: "com.azure.resourcemanager.compute.models.CapacityReservationType.DISABLED"
  name: "DISABLED"
  nameWithType: "CapacityReservationType.DISABLED"
  summary: "The virtual machine has capacity reservation assignment disabled and will not be allowed to implicitly or explicitly associate with any type of capacity reservation."
  modifiers:
  - "static"
  - "final"
  field:
    type: "<xref href=\"com.azure.resourcemanager.compute.models.CapacityReservationType?alt=com.azure.resourcemanager.compute.models.CapacityReservationType&text=CapacityReservationType\" data-throw-if-not-resolved=\"False\" />"
  syntax: "public static final CapacityReservationType DISABLED"
  desc: "The virtual machine has capacity reservation assignment disabled and will not be allowed to implicitly or explicitly associate with any type of capacity reservation."
- uid: "com.azure.resourcemanager.compute.models.CapacityReservationType.NOT_ELIGIBLE"
  fullName: "com.azure.resourcemanager.compute.models.CapacityReservationType.NOT_ELIGIBLE"
  name: "NOT_ELIGIBLE"
  nameWithType: "CapacityReservationType.NOT_ELIGIBLE"
  summary: "The virtual machine is not eligible to be implicitly associated with an open capacity reservation and is not explicitly associated with any capacity reservation group, so it will consume capacity from the publicly available capacity."
  modifiers:
  - "static"
  - "final"
  field:
    type: "<xref href=\"com.azure.resourcemanager.compute.models.CapacityReservationType?alt=com.azure.resourcemanager.compute.models.CapacityReservationType&text=CapacityReservationType\" data-throw-if-not-resolved=\"False\" />"
  syntax: "public static final CapacityReservationType NOT_ELIGIBLE"
  desc: "The virtual machine is not eligible to be implicitly associated with an open capacity reservation and is not explicitly associated with any capacity reservation group, so it will consume capacity from the publicly available capacity."
- uid: "com.azure.resourcemanager.compute.models.CapacityReservationType.OPEN"
  fullName: "com.azure.resourcemanager.compute.models.CapacityReservationType.OPEN"
  name: "OPEN"
  nameWithType: "CapacityReservationType.OPEN"
  summary: "The virtual machine if eligible will implicitly associate and consume any available capacity from a matching open capacity reservation created or shared in the subscription."
  modifiers:
  - "static"
  - "final"
  field:
    type: "<xref href=\"com.azure.resourcemanager.compute.models.CapacityReservationType?alt=com.azure.resourcemanager.compute.models.CapacityReservationType&text=CapacityReservationType\" data-throw-if-not-resolved=\"False\" />"
  syntax: "public static final CapacityReservationType OPEN"
  desc: "The virtual machine if eligible will implicitly associate and consume any available capacity from a matching open capacity reservation created or shared in the subscription. \\*\\*Note:\\*\\* The VM should not be explicitly associated with the open capacity reservation group resource containing the matching reservation."
- uid: "com.azure.resourcemanager.compute.models.CapacityReservationType.TARGETED"
  fullName: "com.azure.resourcemanager.compute.models.CapacityReservationType.TARGETED"
  name: "TARGETED"
  nameWithType: "CapacityReservationType.TARGETED"
  summary: "The virtual machine will consume capacity from a specific matching capacity reservation when associated with a capacity reservation group resource of type targeted, but can fall back to consume capacity from the publicly available capacity if there is no capacity available in the targeted reservation."
  modifiers:
