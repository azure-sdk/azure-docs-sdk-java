  desc: "Start an Agent Insights run for a monitor.\n\n**Header Parameters**\n\n    | ------------ | ------ | -------- | ----------------------------------------------------------------------------------------------------------- |\n    | Name         | Type   | Required | Description                                                                                                 |\n    | Operation-Id | String | No       | Client-generated unique ID for idempotent retries. When absent, the server creates the job unconditionally. |\n\nYou can add these to a request with <xref uid=\"com.azure.core.http.rest.RequestOptions.addHeader\" data-throw-if-not-resolved=\"false\" data-raw-source=\"RequestOptions#addHeader\"></xref>\n\n**Request Body Schema**\n\n```java\n{\n     lookback_hours: Double (Optional)\n }\n```\n\n**Response Body Schema**\n\n```java\n{\n     id: String (Required)\n     inputs (Optional): {\n         lookback_hours: Double (Optional)\n     }\n     result (Optional): {\n         traces_in_window: int (Required)\n         traces_analyzed: int (Required)\n         insights_created: int (Required)\n         insights_updated: int (Required)\n         insights_reopened: int (Required)\n         token_usage (Required): {\n             input_tokens: int (Required)\n             output_tokens: int (Required)\n             cached_tokens: Integer (Optional)\n             total_tokens: int (Required)\n         }\n     }\n     status: String(queued/in_progress/succeeded/failed/cancelled) (Required)\n     error (Optional): {\n         code: String (Required)\n         message: String (Required)\n         param: String (Optional)\n         type: String (Optional)\n         details (Optional): [\n             (recursive schema, see above)\n         ]\n         additionalInfo (Optional): {\n             String: BinaryData (Required)\n         }\n         debugInfo (Optional): {\n             String: BinaryData (Required)\n         }\n     }\n     monitor_id: String (Required)\n     agent_name: String (Required)\n     trigger: String(on_demand/scheduled) (Required)\n     created_at: long (Required)\n     updated_at: long (Required)\n     window_start: long (Required)\n     window_end: long (Required)\n     started_at: Long (Optional)\n     completed_at: Long (Optional)\n     model_deployment_name: String (Required)\n }\n```"
  returns:
    description: "the <xref uid=\"com.azure.core.util.polling.PollerFlux\" data-throw-if-not-resolved=\"false\" data-raw-source=\"PollerFlux\"></xref> for polling of a long-running run that analyzes one agent's traces and updates\n that agent's insights."
    type: "<xref href=\"com.azure.core.util.polling.PollerFlux?alt=com.azure.core.util.polling.PollerFlux&text=PollerFlux\" data-throw-if-not-resolved=\"False\" />&lt;<xref href=\"com.azure.core.util.BinaryData?alt=com.azure.core.util.BinaryData&text=BinaryData\" data-throw-if-not-resolved=\"False\" />,<xref href=\"com.azure.core.util.BinaryData?alt=com.azure.core.util.BinaryData&text=BinaryData\" data-throw-if-not-resolved=\"False\" />&gt;"
